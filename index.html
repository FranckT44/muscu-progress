<style>

.row{display:flex;gap:8px;align-items:center}.row.sb{justify-content:space-between}.row.wrap{flex-wrap:wrap}

.tag.on{color:var(--ok);border-color:#1f5a40}.tag.t-triset{color:#c9a2ff;border-color:#4b3a6e}.tag.t-superset{color:#7cc7ff;border-color:#2b4d66}.tag.t-single{color:var(--ac2)}.chip.on{background:var(--ac);color:#1a0d02;border-color:var(--ac);font-weight:600}.sw{min-width:30px;height:28px;font-size:13px;margin-left:6px;vertical-align:middle}.bchips{display:flex;flex-wrap:wrap;gap:5px;margin:2px 0 6px 24px}.bc{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:6px 9px;font-size:13px;cursor:pointer}.scroll{overflow-x:auto}.heat{font-size:12px}.heat td,.heat th{text-align:center;min-width:30px;padding:5px 2px}.heat td:first-child{min-width:70px}.tag.t-circuit{color:#7ee0c3;border-color:#265a4b}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.grid button{padding:16px 4px;font-size:16px;font-weight:700;background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:12px;cursor:pointer}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#2b303b;color:var(--tx);padding:10px 16px;border-radius:12px;z-index:30;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw}#toast.on{opacity:1}
svg.chart{width:100%;height:auto;display:block}
.chart .ln{fill:none;stroke:var(--ac);stroke-width:2.5;stroke-linejoin:round}.chart .pt{fill:var(--ac)}.chart .gr{stroke:var(--line)}.chart text{fill:var(--mu);font-size:10px}

.exr{padding:10px 0;border-top:1px solid var(--line)}.mini{display:flex;gap:16px;flex-wrap:wrap;margin-top:4px;font-size:13px}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl th{text-align:left;color:var(--mu);font-weight:600;font-size:11px}.tbl td,.tbl th{padding:6px 4px;border-top:1px solid var(--line);vertical-align:top}
[hidden]{display:none!important}
body.fs-l{zoom:1.1}body.fs-xl{zoom:1.2}
.mus{display:inline-block;font-size:12px;font-weight:600;color:var(--ac2);background:rgba(255,138,61,.12);border:1px solid rgba(255,138,61,.35);border-radius:6px;padding:2px 7px;margin:4px 0 2px}
.seg.big{padding:4px;gap:4px;margin-bottom:14px}.seg.big button{padding:10px 4px;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:3px;border:1px solid transparent}.seg.big button:not(.on){border-color:var(--line);background:var(--card)}.seg.big button b{font-size:22px;font-weight:400}
.fh{display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none}.fh .k{margin:0}.fh .fa{color:var(--ac);font-size:18px;padding:0 2px 0 12px}
.gh .fa,.sgh .fa{display:inline-block;width:24px;color:var(--ac)}
.gh{cursor:pointer;user-select:none;font-size:22px;font-weight:800;color:var(--tx);margin:22px 0 10px;padding:4px 0 6px 12px;border-left:5px solid var(--ac);letter-spacing:.01em;break-after:avoid}.gh .muted{font-size:15px;font-weight:600}
.sgh{cursor:pointer;user-select:none;font-size:15px;font-weight:700;color:var(--ac2);padding:12px 0 2px;border-bottom:1px solid var(--line)}
.wgrid{display:flex;flex-direction:column}.wmain,.wside{display:contents}
body.wide main{max-width:1320px;padding:16px 24px 190px}
body.wide .narrow{max-width:760px;margin:0 auto}
body.wide .cols{column-count:2;column-gap:16px}
body.wide .cols>*{break-inside:avoid}
body.wide .cols>.seg,body.wide .cols>select,body.wide .cols>.row,body.wide .cols>.chips,body.wide .cols>.full,body.wide .cols>.link,body.wide .cols>.btn.wide,body.wide .cols>p{column-span:all}
body.wide .cols>.k,body.wide .cols>.gh{break-after:avoid}
body.wide .wgrid{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px;align-items:start}
body.wide .wmain,body.wide .wside{display:block}
body.wide .wside{position:sticky;top:76px;max-height:calc(100vh - 290px);overflow:auto;padding-right:4px}
body.wide #tbar{left:auto;right:24px;width:420px;margin:0;bottom:76px}
body.wide #ttime{font-size:46px}
body.wide nav.tabs{justify-content:center}
body.wide nav.tabs button{flex:0 0 140px}
body.wide .sheet{border-radius:18px;margin-bottom:10vh}
body.wide #modal{align-items:center}
body.wide svg.chart{max-height:300px}
body.xwide .cols{column-count:3}
</style>
</head>
<body>

<script>
'use strict';
const APP_VERSION='1.7.1',APP_DATE='21/11/2026';
const CHANGELOG=[
 ['1.7.1','21/11/2026',['Le lieu « Déplacement » s’appelle désormais « En déplacement » (modules de déplacement renommés aussi)']],
 ['1.7.0','21/11/2026',['Intitulés des champs (Nom du module, Tours, Objectif par tour…) plus grands, en gras et plus lisibles ; petits textes et titres de rubriques agrandis','Réglages → Affichage : « Taille du texte » Normale / Grande / Très grande pour toute l’appli']],
 ['1.6.1','21/11/2026',['Éditeur de module et écran de séance : le groupe et le sous-groupe musculaire de chaque exercice sont affichés (ex. Épaules › Latéral · Isolation)']],
 ['1.6.0','21/11/2026',['Fiche exercice : choisir un mouvement existant propose de reprendre son classement (groupe, sous-groupe, Iso/Poly, secondaires)','Bouton « ⧉ Dupliquer » pour créer un exercice à partir d’un autre','Aide-mémoire « Comment classer un exercice ? » dans la fiche']],
 ['1.5.2','21/11/2026',['Progrès : onglets Historique · Exercices · Muscles · Programme agrandis, avec icônes','Progrès → Exercices : la courbe du 1RM estimé est placée juste sous celle du volume']],
 ['1.5.1','21/11/2026',['Accueil : lien « ne pas l’appliquer » pour ignorer le mode reprise avant de démarrer (il se réactivera seulement après une nouvelle longue pause)']],
 ['1.5.0','21/11/2026',['Accueil : « X exercices seront remplacés » devient cliquable et montre la liste exercice d’origine → équivalent, module par module','Possibilité de choisir un autre équivalent avant de démarrer (choix mémorisé pour le lieu)']],
 ['1.4.0','21/11/2026',['Accueil : les cartes « Programme » et « Séance libre » se replient d’un tap sur leur titre ; programme replié = nom, avancement, prochaine séance et bouton Démarrer']],
 ['1.3.0','21/11/2026',['Liste des exercices, vue « Par matériel » : chaque matériel est détaillé par groupe musculaire (Élastiques › Épaules, Biceps…), chaque niveau se replie']],
 ['1.2.0','21/11/2026',['Liste des exercices : déplier / replier chaque groupe et sous-groupe d’un tap, boutons « Tout déplier » et « Tout replier » (l’état est mémorisé) ; une recherche déplie tout automatiquement']],
 ['1.1.1','21/11/2026',['Liste des exercices : titres de groupes (Épaules, Biceps…) beaucoup plus grands et visibles, avec le nombre d’exercices ; sous-groupes agrandis']],
 ['1.1.0','21/11/2026',['Bouton « Tout activer / Tout désactiver » pour le matériel disponible','Numéro de version affiché (Réglages) et liste des nouveautés','Message « Mise à jour installée » à l’ouverture après une mise à jour','Les données sont enregistrées dès la première ouverture','Une restauration compte comme une sauvegarde (plus de faux rappel)']],
 ['1.0.0','21/11/2026',['Première mise en ligne : programmes WO 1 / WO 2, modules, circuits, rest-pause, chrono et sonneries','Lieux (Maison / Déplacement), matériel du jour, équivalences TRX / élastiques SmartWorkout','Sous-groupes musculaires, Iso / Poly, bilan Muscles, 1RM estimé, charges cibles, records','Plaques pour la poulie, mode reprise, affichage DeX multicolonne, sauvegarde vers OneDrive']]];
/* ================= Constantes & utilitaires ================= */
const DB_KEY='muscu-progress.v2';
const EQUIP={halteres:'Haltères',barre:'Barre',poulie:'Poulie',machine:'Machine',elastique:'Élastiques',barre_el:'Barre + élastiques',trx:'TRX',traction:'Barre de traction',pdc:'Poids du corps'};
const ANCH={'':'Aucun',pieds:'Sous les pieds',haut:'Ancrage haut',median:'Ancrage médian',bas:'Ancrage bas'};
const DEF_TREE={"Épaules": ["Antérieur", "Latéral", "Postérieur"], "Biceps": ["Chef long", "Chef court", "Brachial", "Brachio-radial"], "Triceps": ["Chef long", "Chef latéral", "Chef médial"], "Dos": ["Grand dorsal", "Trapèzes sup.", "Trapèzes moyens / rhomboïdes", "Lombaires"], "Pectoraux": ["Haut", "Milieu", "Bas"], "Abdos": ["Grand droit", "Obliques", "Transverse / gainage"], "Jambes": ["Quadriceps", "Ischios", "Adducteurs"], "Fessiers": ["Grand fessier", "Moyen fessier"], "Mollets": ["Gastrocnémiens", "Soléaire"], "Avant-bras": ["Fléchisseurs", "Extenseurs"], "Cardio": [], "Autre": []};
const GROUPS=()=>Object.keys(db.settings.muscleTree);
const SUBS=g=>db.settings.muscleTree[g]||[];
const TYPE={iso:'Isolation',poly:'Polyarticulaire'};
const BTYPE={single:1,superset:2,triset:3,circuit:4};
const BLABEL={single:'Simple',superset:'Superset',triset:'Triset',circuit:'Circuit'};
const TITLES={home:'Muscu Progress',workout:'Séance',programs:'Programmes',programEdit:'Programme',modules:'Modules',moduleEdit:'Module',exercises:'Exercices',progress:'Progrès',session:'Bilan de séance',settings:'Réglages'};
const NAVMAP={programEdit:'programs',moduleEdit:'modules',session:'progress',workout:'home',settings:''};
const DEF_SETTINGS={fs:'n',layout:'auto',lastBackup:0,sndRest:'bips',sndRp:'double',sndTick:'tic',vol:70,resumeDays:14,resumePct:15,resumeN:2,muscleTree:DEF_TREE,secW:0.5,rmF:'epley',bands:[{name:'5',kg:5,n:1},{name:'10',kg:10,n:1},{name:'15',kg:15,n:1},{name:'20',kg:20,n:1},{name:'25',kg:25,n:4}],locations:[{id:'home',name:'Maison',icon:'🏠',equip:['halteres','barre','poulie','machine','traction','elastique','barre_el'],anchors:['haut','median','bas']},{id:'travel',name:'En déplacement',icon:'🧳',equip:['elastique','trx'],anchors:['haut','median','bas']}],curLoc:'home',timers:[25,45,60,90,120,180,240],defaultRest:60,rpSec:5,sound:true,vibrate:true,wake:true};

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const clone=o=>JSON.parse(JSON.stringify(o));
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const fmtTime=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60;return (h?h+':'+pad(m):m)+':'+pad(r)};
const fmtDur=s=>{s=+s;if(s<60)return s+'s';const m=Math.floor(s/60),r=s%60;return r?`${m}m${pad(r)}`:`${m} min`};
const fmtDate=ts=>new Date(ts).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});
const fmtShort=ts=>new Date(ts).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'});
const fmtDateLong=ts=>new Date(ts).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+' · '+new Date(ts).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
const fmtMin=ms=>Math.max(1,Math.round(ms/60000))+' min';
const fmtNum=v=>{if(v==null||isNaN(v))return '–';const a=Math.abs(v);return (a>=100?Math.round(v):Math.round(v*10)/10).toLocaleString('fr-FR')};
const fmtKg=v=>v>=10000?(v/1000).toLocaleString('fr-FR',{maximumFractionDigits:1})+' t':Math.round(v).toLocaleString('fr-FR')+' kg';
const firstNum=s=>{const m=String(s??'').match(/\d+/);return m?+m[0]:''};

/* ================= Son, vibration, écran ================= */
let AC=null;
function unlockAudio(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}
function tone(f,t0,d,o={}){if(!AC)return;try{const vol=(+db.settings.vol||0)/100*(o.v??.35);const os=AC.createOscillator(),g=AC.createGain();os.type=o.type||'sine';const t=AC.currentTime+t0;os.frequency.setValueAtTime(f,t);if(o.to)os.frequency.exponentialRampToValueAtTime(o.to,t+d);if(o.vib){const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=o.vib;lg.gain.value=f*.06;l.connect(lg);lg.connect(os.frequency);l.start(t);l.stop(t+d+.05)}
  os.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(vol,.0002),t+(o.att||.01));g.gain.exponentialRampToValueAtTime(.0001,t+d);os.start(t);os.stop(t+d+.05)}catch(e){}}
const bell=(f,t0,d=1.6)=>{tone(f,t0,d,{v:.35});tone(f*2.76,t0,d*.6,{v:.12});tone(f*5.4,t0,d*.3,{v:.06})};

  gong:{label:'Gong',play:()=>{tone(196,0,3,{v:.45,att:.005});tone(294,0,2.2,{v:.2});tone(466,0,1.4,{v:.1})}},
  cloche:{label:'Cloche de ring (boxe)',play:()=>{bell(880,0,.9);bell(880,.35,.9);bell(880,.7,1.6)}},
  sifflet:{label:'Sifflet d’arbitre',play:()=>{tone(2600,0,.35,{type:'sine',vib:28,v:.25});tone(2600,.45,.7,{type:'sine',vib:28,v:.25})}},
  alarme:{label:'Alarme (forte)',play:()=>{for(let i=0;i<4;i++){tone(880,i*.3,.14,{type:'square',v:.18});tone(660,i*.3+.15,.14,{type:'square',v:.18})}}},

/* ================= Chrono ================= */
const T={running:false,paused:false,end:0,dur:0,rem:0,label:'',beeped:{},hideAt:0};
function startTimer(sec,label='Repos'){sec=+sec;if(!(sec>0))return;unlockAudio();Object.assign(T,{dur:sec,end:Date.now()+sec*1000,running:true,paused:false,label,beeped:{},hideAt:0});const tb=$('#tbar');tb.hidden=false;tb.classList.remove('end');paintTimer()}
function stopTimer(){T.running=false;T.hideAt=0;$('#tbar').hidden=true}
const tRem=()=>T.paused?T.rem:(T.end-Date.now())/1000;
function paintTimer(){if($('#tbar').hidden)return;const r=T.running?Math.max(0,tRem()):0;$('#ttime').textContent=T.running?fmtTime(Math.ceil(r)):'GO !';$('#tlabel').textContent=T.running?T.label+(T.paused?' (pause)':''):'Repos terminé 💪';$('#tprog').style.width=(T.running?(1-r/T.dur)*100:100)+'%';$('#tpause').textContent=T.paused?'▶':'⏸'}
setInterval(()=>{
  const el=$('#elapsed');if(el&&db.active)el.textContent=fmtTime((Date.now()-db.active.start)/1000);
  if(!T.running&&T.hideAt&&Date.now()>T.hideAt){$('#tbar').hidden=true;T.hideAt=0}
  if(!T.running||T.paused)return;
  const r=tRem(),c=Math.ceil(r);
  if(c<=3&&c>=1&&!T.beeped[c]){T.beeped[c]=1;playSnd(db.settings.sndTick,TICKS)}
  if(r<=0){T.running=false;playSnd(/Rest-pause/.test(T.label)?db.settings.sndRp:db.settings.sndRest);if(db.settings.vibrate&&navigator.vibrate)navigator.vibrate([300,120,300,120,500]);$('#tbar').classList.add('end');T.hideAt=Date.now()+8000}
  paintTimer();
},200);
A.timerPanel=()=>modal(`<h3>⏱ Chrono de repos</h3><div class="grid">${db.settings.timers.map(s=>`<button data-a="tStart" data-v="${s}">${fmtDur(s)}</button>`).join('')}</div><div class="row" style="margin-top:12px"><input type="number" id="tCust" inputmode="numeric" placeholder="Autre durée (secondes)"><button class="btn" data-a="tCustom">Go</button></div><button class="btn ghost wide" data-a="closeModal">Fermer</button>`);
A.tStart=el=>{closeModal();startTimer(+el.dataset.v)};
A.tCustom=()=>{const v=+$('#tCust').value;closeModal();startTimer(v)};
A.tAdd=el=>{const v=+el.dataset.v;if(!T.running){if(v>0)startTimer(v);return}if(T.paused)T.rem=Math.max(1,T.rem+v);else T.end=Math.max(Date.now()+1000,T.end+v*1000);T.dur=Math.max(T.dur+v,tRem(),1);T.beeped={};paintTimer()};
A.tPause=()=>{if(!T.running)return;if(T.paused){T.end=Date.now()+T.rem*1000;T.paused=false}else{T.rem=tRem();T.paused=true}paintTimer()};
A.tStop=()=>stopTimer();

function adaptCount(mids,loc=curLoc()){let sub=0,miss=0;mids.forEach(mid=>{const m=db.modules.find(x=>x.id===mid);if(m)m.blocks.forEach(b=>b.items.forEach(it=>{const s=subFor(it.exId,loc);if(!s)miss++;else if(s!==it.exId)sub++}))});return {sub,miss}}
function adaptInfo(mids){const a=adaptCount(mids);if(!a.sub&&!a.miss)return '';return `<div class="xs tap" data-a="adaptShow" data-m="${mids.join(',')}" style="margin-top:4px;color:var(--ac2);text-decoration:underline dotted;text-underline-offset:3px">${curLoc().icon||''} ${a.sub?a.sub+' exercice(s) seront remplacés par un équivalent':''}${a.sub&&a.miss?' · ':''}${a.miss?a.miss+' sans équivalent ici':''} — <b>voir le détail ›</b></div>`}
function adaptCands(orig,loc){const ex=exById(orig)||{};const all=db.exercises.filter(e=>e.id!==orig&&feasible(e,loc));const sm=all.filter(e=>ex.move&&e.move===ex.move),ss=all.filter(e=>!sm.includes(e)&&ex.sub&&e.muscle===ex.muscle&&e.sub===ex.sub),sg=all.filter(e=>!sm.includes(e)&&!ss.includes(e)&&e.muscle===ex.muscle);return [['Même mouvement',sm],['Même sous-groupe',ss],['Même groupe',sg]]}
A.adaptShow=el=>{const mids=(el.dataset.m||'').split(',').filter(Boolean);S.adaptM=mids;const loc=curLoc();let h=`<h3>${esc(loc.icon||'')} Remplacements pour « ${esc(loc.name)} »</h3><p class="xs muted">D’après le matériel activé. Touche ⇄ pour choisir un autre équivalent : ton choix est mémorisé pour ce lieu.</p>`;let n=0;
  mids.forEach(mid=>{const m=db.modules.find(x=>x.id===mid);if(!m)return;const rows=[];m.blocks.forEach(b=>b.items.forEach(it=>{const s=subFor(it.exId,loc);if(s===it.exId)return;const o=exById(it.exId)||{name:'?'};rows.push(`<div class="li row sb"><div class="sm"><span class="muted">${esc(o.name)}</span><br>${s?`→ <b>${esc(exById(s).name)}</b> <span class="tag">${EQUIP[exById(s).equip]}${exById(s).anchor&&exById(s).anchor!=='pieds'?' · '+ANCH[exById(s).anchor].replace('Ancrage ',''):''}</span>`:'<b style="color:var(--bad)">⚠ aucun équivalent avec ce matériel</b>'}</div><button class="icon" data-a="adaptPick" data-o="${it.exId}" title="Choisir un autre équivalent">⇄</button></div>`)}));
    if(rows.length){n+=rows.length;h+=`<div class="k" style="margin-top:12px">${esc(m.name)}</div>${rows.join('')}`}});
  if(!n)h+='<p class="sm">Aucun remplacement : tout est faisable avec le matériel du jour.</p>';
  modal(h+`<button class="btn ghost wide" data-a="closeModal">Fermer</button>`)};

/* ================= Séance en cours ================= */
const gapTxt=d=>d>=14?Math.round(d/7)+' semaines':Math.round(d)+' jours';
function resumeFor(){const st=db.settings,p=db.sessions[db.sessions.length-1];if(!p||!(+st.resumeDays>0)||st.resumeSkip===p.id)return null;const gap=(Date.now()-p.start)/864e5;
  if(gap>=+st.resumeDays)return {lvl:1,n:Math.max(1,+st.resumeN||1),gap:Math.round(gap),pct:+st.resumePct||0};
  if(p.resume&&p.resume.lvl<(p.resume.n||1))return {lvl:p.resume.lvl+1,n:p.resume.n,gap:p.resume.gap,pct:Math.round(p.resume.pct/2)};return null}
async function startWorkout(o){
  if(db.active&&!(await ask('Une séance est déjà en cours. La remplacer ? (elle sera perdue)','Remplacer')))return;
  const loc=curLoc();let nS=0,nM=0;const blocks=[];
  o.moduleIds.forEach(mid=>{const m=db.modules.find(x=>x.id===mid);if(m)m.blocks.forEach(b=>blocks.push({type:b.type,sets:+b.sets||1,rest:+b.rest||0,restEnd:+b.restEnd||0,module:m.name,log:[],
    items:clone(b.items).map(it=>{const s=subFor(it.exId,loc);if(s&&s!==it.exId){nS++;return {...it,orig:it.exId,exId:s,load:'',band:''}}if(!s){nM++;return {...it,missing:true}}return it})}))});
  if(!blocks.length)return toast('Cette séance ne contient aucun module');
  S.open={};db.active={id:uid(),start:Date.now(),loc:loc.id,resume:resumeFor(),name:o.name+(loc.id!==db.settings.locations[0].id?' · '+loc.name:''),programId:o.programId||null,templateId:o.templateId||null,blocks,pendingRP:null};save();wake(true);go('workout');if(nS||nM)setTimeout(()=>toast(`${loc.icon||''} ${nS} exercice(s) adapté(s) au matériel${nM?` · ${nM} sans équivalent (⇄)`:''}`),300);

    ${(()=>{const f=db.sessions.find(x=>x.start<s.start&&exSets(x,id).length);const fs=f&&exStats(exSets(f,id),id);return `<div class="mini"><div><span class="xs muted">${cur.volLabel}</span> <b>${fmtNum(cur.volume)}</b> ${ps?delta(cur.volume,ps.volume):''}</div>${fs?`<div><span class="xs muted">Depuis le début</span> ${delta(cur.volume,fs.volume)}</div>`:''}<div><span class="xs muted">${cur.bestLabel}</span> <b>${fmtNum(cur.best)}</b> ${ps?delta(cur.best,ps.best):''}</div></div>`})()}</div>`});
  return h+`</div><button class="btn danger ghost wide" data-a="delSession" data-id="${s.id}">Supprimer cette séance</button>`;
};
A.delSession=el=>ask('Supprimer définitivement cette séance ?','Supprimer').then(ok=>{if(ok){db.sessions=db.sessions.filter(s=>s.id!==el.dataset.id);save();go('progress')}});

/* ================= Progrès ================= */
V.progress=()=>{const tabs=[['hist','Historique'],['ex','Exercices'],['mus','Muscles'],['prog','Programme']];
  const ic={hist:'📜',ex:'🏋️',mus:'💪',prog:'📋'};let h=`<div class="seg big">${tabs.map(([k,l])=>`<button class="${S.ptab===k?'on':''}" data-a="ptab" data-v="${k}"><b>${ic[k]}</b>${l}</button>`).join('')}</div>`;
  return h+(S.ptab==='ex'?exProgView():S.ptab==='prog'?progBilanView():S.ptab==='mus'?musView():histView())};
function musCredits(st){const ex=exById(st.exId);if(!ex)return [];const out=[[ex.muscle,ex.sub||'',1]];const w=+db.settings.secW||0;if(w)(ex.sec||[]).forEach(s=>{const [g,sb]=s.split('|');out.push([g,sb||'',w])});return out}
function musView(){
  if(!db.sessions.length)return '<div class="card muted">Pas encore de séance.</div>';
  const W=6,D=7*864e5,wk=t=>{const d=new Date(t);return new Date(d.getFullYear(),d.getMonth(),d.getDate()-(d.getDay()+6)%7).getTime()};
  const lastS=db.sessions[db.sessions.length-1].start;let end=wk(Date.now());const recent=db.sessions.some(s=>s.start>=end-(W-1)*D);if(!recent)end=wk(lastS);
  const weeks=[...Array(W)].map((_,i)=>end-(W-1-i)*D);const G={},Sb={},sess=Array(W).fill('');
  db.sessions.forEach(s=>{const wi=weeks.findIndex(w=>s.start>=w&&s.start<w+D);if(wi<0)return;sess[wi]+=locIcon(s.loc);setsOf(s).forEach(st=>musCredits(st).forEach(([g,sb,w])=>{(G[g]=G[g]||Array(W).fill(0))[wi]+=w;const k=g+'|'+sb;(Sb[k]=Sb[k]||Array(W).fill(0))[wi]+=w}))});
  const mx=Math.max(1,...Object.values(G).flat()),mxs=Math.max(1,...Object.values(Sb).flat());const ms=[...GROUPS(),...Object.keys(G).filter(m=>!GROUPS().includes(m))].filter(m=>G[m]);
  const cell=(v,m)=>`<td style="background:rgba(255,138,61,${v?(.12+.6*v/m).toFixed(2):0})">${v?fmtNum(v):''}</td>`;
  S.musOpen=S.musOpen||{};let rows='';
  ms.forEach(m=>{rows+=`<tr class="tap" data-a="musOpen" data-v="${esc(m)}"><td style="text-align:left"><b>${S.musOpen[m]?'▾':'▸'} ${esc(m)}</b></td>${G[m].map(v=>cell(v,mx)).join('')}</tr>`;
    if(S.musOpen[m]){const subs=[...SUBS(m),''];subs.forEach(sb=>{const v=Sb[m+'|'+sb];if(!v&&sb==='')return;rows+=`<tr><td style="text-align:left;padding-left:14px" class="xs ${v?'':'muted'}">${sb?esc(sb):'non précisé'}</td>${(v||Array(W).fill(0)).map(x=>cell(x,mxs)).join('')}</tr>`})}});
  // repères: 4 dernières semaines
  const last4=k=>(Sb[k]||[]).slice(-4).reduce((a,b)=>a+b,0);const flags=[];
  ms.forEach(m=>{const subs=SUBS(m);if(subs.length<2)return;const vals=subs.map(s=>[s,last4(m+'|'+s)]);const top=vals.reduce((a,b)=>b[1]>a[1]?b:a);if(top[1]<4)return;vals.forEach(([s,v])=>{if(v<top[1]/3)flags.push(`<div class="li sm">⚠ <b>${esc(m)} › ${esc(s)}</b> : ${fmtNum(v)} série(s) contre ${fmtNum(top[1])} pour ${esc(top[0])}</div>`)})});
  return `<div class="card"><div class="k">Séries par muscle et par semaine</div><p class="xs muted">Muscle principal = 1 série · secondaire = ${fmtNum(db.settings.secW)} série (réglable). Touche un groupe pour voir ses sous-groupes. Tous lieux confondus.${recent?'':' (6 semaines jusqu’à ta dernière séance)'}</p><div class="scroll"><table class="tbl heat"><tr><th></th>${weeks.map(w=>`<th>${fmtShort(w)}</th>`).join('')}</tr><tr><td class="xs muted" style="text-align:left">Séances</td>${sess.map(x=>`<td class="xs">${x||'·'}</td>`).join('')}</tr>${rows}</table></div></div>
  <div class="card"><div class="k">Repères — 4 dernières semaines affichées</div>${flags.join('')||'<p class="sm muted">Aucun sous-groupe nettement délaissé (moins d’un tiers du plus travaillé de son groupe).</p>'}<p class="xs muted">Un sous-groupe est signalé quand il reçoit moins d’un tiers des séries du sous-groupe le plus travaillé du même groupe.</p></div>`}
A.musOpen=el=>{S.musOpen=S.musOpen||{};S.musOpen[el.dataset.v]=!S.musOpen[el.dataset.v];render()};
A.ptab=el=>{S.ptab=el.dataset.v;render()};
function histView(){
  if(!db.sessions.length)return '<div class="card muted">Aucune séance enregistrée pour l’instant. Lance ta première séance depuis l’accueil !</div>';
  return `<div class="card list">${[...db.sessions].reverse().map(s=>{const t=sessionTotals(s),p=prevComparable(s),pt=p&&sessionTotals(p);return `<div class="li tap row sb" data-a="openSession" data-id="${s.id}"><div><b>${locIcon(s.loc)} ${s.resume?'🔄 ':''}${esc(s.name)}</b><div class="xs muted">${fmtDate(s.start)} · ${t.sets} séries · ${fmtMin(s.end-s.start)}${s.rpe?' · RPE '+s.rpe:''}</div></div><div style="text-align:right"><b>${fmtKg(t.volume)}</b><div>${pt?delta(t.volume,pt.volume):''}</div></div></div>`}).join('')}</div>`;
}
function exProgView(){
  const ids=[...new Set(db.sessions.flatMap(exIdsOf))].filter(exById);
  if(!ids.length)return '<div class="card muted">Termine une première séance pour voir tes courbes de progression.</div>';
  const id=ids.includes(S.pex)?S.pex:ids[0];const ex=exById(id);
  const hist=db.sessions.filter(s=>exSets(s,id).length).map(s=>({s,sets:exSets(s,id),st:exStats(exSets(s,id),id)}));
  const f=hist[0].st,l=hist[hist.length-1].st,rec=Math.max(...hist.map(x=>x.st.best));
  let h=`<select data-ch="pickEx">${ids.map(exById).sort((a,b)=>a.name.localeCompare(b.name)).map(e=>`<option value="${e.id}" ${e.id===id?'selected':''}>${esc(e.name)}</option>`).join('')}</select>
  <div class="card" style="margin-top:10px"><h2>${esc(ex.name)}</h2><div class="xs muted">${muscLabel(ex)}${ex.type?' · '+TYPE[ex.type]:''} · ${EQUIP[ex.equip]}${ex.sec&&ex.sec.length?' · + '+ex.sec.map(s=>esc(s.replace('|',' › '))).join(', '):''}</div><div class="kpis">${kpi('Record · '+l.bestLabel,fmtNum(rec))}${kpi('Dernière séance',fmtNum(l.best))}${kpi('Depuis le début',hist.length>1?delta(l.best,f.best)||'=':'–')}${kpi('Séances',hist.length)}</div></div>
  <div class="card"><div class="k">${l.volLabel}</div>${chart(hist.map(x=>({label:fmtShort(x.s.start),y:x.st.volume})))}</div>
  <div class="card"><div class="k">${l.bestLabel}</div>${chart(hist.map(x=>({label:fmtShort(x.s.start),y:x.st.best})))}</div>
  ${l.kind==='load'&&rec>0?`<div class="card"><div class="k">Charges cibles</div><p class="xs muted">D’après ton 1RM estimé record (${fmtNum(rec)}${U(ex)}, formule ${({epley:'Epley',brzycki:'Brzycki',avg:'moyenne'})[db.settings.rmF]}). Arrondi à 0,5${U(ex)}</p><div class="kpis">${[6,8,10,12,15,20].map(n=>kpi(n+' reps',fmtNum(r05(loadFor(rec,n)))+U(ex))).join('')}</div></div>`:''}
  ${l.kind!=='time'?`<div class="card"><div class="k">Planifier la prochaine étape</div><p class="xs muted">Base : volume de la dernière séance = <b>${fmtNum(l.volume)}</b>. Choisis un schéma pour connaître ${l.kind==='load'?(isPl(ex)?'le nombre de plaques':'la charge'):'le coefficient'} à viser.</p><div class="row"><label class="fld"><span>Séries</span><input type="number" id="plS" value="${S.plS||3}"></label><label class="fld"><span>Reps</span><input type="number" id="plR" value="${S.plR||12}"></label><label class="fld"><span>Progression %</span><input type="number" id="plP" value="${S.plP??5}"></label></div><div id="plOut" data-vol="${l.volume}" data-kind="${l.kind}" data-u="${U(ex)}">${planOut(l.volume,l.kind,U(ex))}</div></div>`:''}
  <div class="card"><div class="k">Détail séance par séance</div><table class="tbl"><tr><th>Date</th><th>Séries</th><th>Meilleure</th><th>Volume</th></tr>`;
  for(let i=hist.length-1;i>=0;i--){const x=hist[i],p=hist[i-1];h+=`<tr class="tap" data-a="openSession" data-id="${x.s.id}"><td>${fmtShort(x.s.start)}</td><td class="xs">${x.sets.map(fmtSet).join('<br>')}</td><td>${fmtNum(x.st.best)}<br>${p?delta(x.st.best,p.st.best):''}</td><td>${fmtNum(x.st.volume)}<br>${p?delta(x.st.volume,p.st.volume):''}</td></tr>`}
  return h+'</table></div>';
}
A.pickEx=el=>{S.pex=el.value;render()};
function planOut(vol,k,un){const n=+(S.plS||3),rp=+(S.plR||12),pc=+(S.plP??5);if(!(n>0&&rp>0))return '';const eq=vol/(n*rp),tg=eq*(1+pc/100);const u=k==='load'?(un||' kg'):' × PDC';
  return `<div class="kpis">${kpi('Pour égaler',fmtNum(eq)+u)}${kpi('Objectif +'+fmtNum(pc)+' %',fmtNum(tg)+u)}${kpi('Volume visé',fmtNum(vol*(1+pc/100)))}</div><div class="xs muted">${n} × ${rp} reps à charge constante.</div>`}
function progBilanView(){
  if(!db.programs.length)return '<div class="card muted">Aucun programme.</div>';
  const p=progById(S.pprog)||db.programs[0];const ss=db.sessions.filter(s=>s.programId===p.id);const st=progStatus(p);
  let h=`<select data-ch="pickProg">${db.programs.map(x=>`<option value="${x.id}" ${x.id===p.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>
  <div class="card" style="margin-top:10px"><h2>${esc(p.name)}</h2>${p.goal?`<p class="sm muted">🎯 ${esc(p.goal)}</p>`:''}<div class="bar"><i style="width:${st.pct*100}%"></i></div><div class="xs muted">${st.text}</div>`;
  if(!ss.length)return h+'<p class="muted sm">Aucune séance réalisée dans ce programme pour l’instant.</p></div>';
  const weeks=Math.max(1,Math.ceil((Date.now()-ss[0].start)/(7*864e5)));const tot=ss.reduce((a,s)=>a+sessionTotals(s).volume,0);
  const rpes=ss.filter(s=>s.rpe).map(s=>s.rpe);
  h+=`<div class="kpis">${kpi('Séances',ss.length)}${kpi('Moy. / semaine',fmtNum(ss.length/weeks)+(p.perWeek&&p.durType==='semaines'?' / '+p.perWeek:''))}${kpi('Volume cumulé',fmtKg(tot))}${rpes.length?kpi('Ressenti moyen',fmtNum(rpes.reduce((a,b)=>a+b,0)/rpes.length)+'/10'):''}</div></div>`;
  h+=`<div class="card"><div class="k">Volume par séance</div>${chart(ss.map(s=>({label:fmtShort(s.start),y:sessionTotals(s).volume})))}</div>`;
  if(p.templates.length>1){h+=`<div class="card"><div class="k">Par séance type (1ʳᵉ → dernière)</div>`;p.templates.forEach(t=>{const ts=ss.filter(s=>s.templateId===t.id);if(!ts.length){h+=`<div class="li sm">${esc(t.name)} <span class="muted">· pas encore réalisée</span></div>`;return}const a=sessionTotals(ts[0]),b=sessionTotals(ts[ts.length-1]);h+=`<div class="li row sb"><div><b class="sm">${esc(t.name)}</b><div class="xs muted">${ts.length} fois</div></div><div style="text-align:right" class="sm">${fmtKg(a.volume)} → <b>${fmtKg(b.volume)}</b><div>${ts.length>1?delta(b.volume,a.volume):''}</div></div></div>`});h+='</div>'}
  const ids=[...new Set(ss.flatMap(exIdsOf))];let up=0,flat=0,down=0,rows='';
  ids.forEach(id=>{const w=ss.filter(s=>exSets(s,id).length);const f=exStats(exSets(w[0],id),id),l=exStats(exSets(w[w.length-1],id),id);
    if(w.length>1){const pc=f.best?(l.best-f.best)/f.best*100:0;if(pc>2)up++;else if(pc<-2)down++;else flat++}
    rows+=`<tr><td>${esc(exById(id)?.name||'(supprimé)')}<div class="xs muted">${w.length} séance(s) · ${l.bestLabel}</div></td><td>${fmtNum(f.best)} → <b>${fmtNum(l.best)}</b><br>${w.length>1?delta(l.best,f.best):''}</td><td>${fmtNum(f.volume)} → <b>${fmtNum(l.volume)}</b><br>${w.length>1?delta(l.volume,f.volume):''}</td></tr>`});
  h+=`<div class="card"><div class="k">Bilan par exercice (1ʳᵉ → dernière séance)</div><p class="sm">📈 <b>${up}</b> en progression · ➖ <b>${flat}</b> stables · 📉 <b>${down}</b> en baisse</p><table class="tbl"><tr><th>Exercice</th><th>Meilleure perf.</th><th>Volume</th></tr>${rows}</table></div>`;
  return h;
}

V.programs=()=>`<button class="btn wide" data-a="newProgram">+ Nouveau programme</button><p class="xs muted">Un programme = un objectif + une durée (semaines ou nombre de séances) + des séances types construites à partir de tes modules, enchaînées en rotation.</p>`+
  db.programs.map(p=>{const st=progStatus(p);return `<div class="card tap" data-a="editProgram" data-id="${p.id}"><div class="row sb"><h2>${esc(p.name)}</h2>${p.active!==false?'<span class="tag on">Actif</span>':'<span class="tag">Archivé</span>'}</div>${p.goal?`<p class="sm muted">🎯 ${esc(p.goal)}</p>`:''}<div class="bar"><i style="width:${st.pct*100}%"></i></div><div class="xs muted">${st.text}</div><div class="xs" style="margin-top:6px">${p.templates.map(t=>esc(t.name)).join(' · ')}</div></div>`}).join('');
const blankProgram=()=>({id:uid(),name:'',goal:'',durType:'seances',weeks:8,perWeek:3,count:24,start:today(),active:true,templates:[{id:uid(),name:'Séance A',moduleIds:[]}]});
A.newProgram=()=>{S.draft=blankProgram();go('programEdit')};
A.editProgram=el=>{S.draft=clone(progById(el.dataset.id));go('programEdit')};
V.programEdit=()=>{
  const d=S.draft;if(!d)return V.programs();
  let h=`<button class="link" data-a="go" data-v="programs">← Programmes</button><div class="card">
  <label class="fld"><span>Nom du programme</span><input data-f="name" value="${esc(d.name)}" placeholder="Ex : Haut du corps – 8 semaines"></label>
  <label class="fld"><span>Objectif</span><textarea data-f="goal" rows="2" placeholder="Ex : +10 % au curl, 12 reps strictes aux tractions…">${esc(d.goal)}</textarea></label>
  <div class="fld"><span>Durée du programme</span><div class="seg"><button class="${d.durType==='semaines'?'on':''}" data-a="durType" data-v="semaines">En semaines</button><button class="${d.durType==='seances'?'on':''}" data-a="durType" data-v="seances">En nombre de séances</button></div></div>
  ${d.durType==='semaines'?`<div class="row"><label class="fld"><span>Nombre de semaines</span><input type="number" data-f="weeks" value="${d.weeks}"></label><label class="fld"><span>Séances / semaine visées</span><input type="number" data-f="perWeek" value="${d.perWeek||3}"></label></div>`:`<label class="fld"><span>Nombre de séances</span><input type="number" data-f="count" value="${d.count}"></label>`}
  <label class="fld"><span>Date de début</span><input type="date" data-f="start" value="${esc(d.start)}"></label>
  <label class="chk"><input type="checkbox" data-f="active" ${d.active!==false?'checked':''}> Programme actif (affiché sur l’accueil)</label></div>
  <div class="k">Séances types — enchaînées en rotation (A → B → A…)</div>`;
  d.templates.forEach((t,ti)=>{h+=`<div class="card"><div class="row sb"><input class="ttl" data-f="templates.${ti}.name" value="${esc(t.name)}"><button class="icon" data-a="delTpl" data-i="${ti}" title="Supprimer">🗑</button></div>
    ${t.moduleIds.map((mid,mi)=>`<div class="row sb li"><span class="sm">🧩 ${esc(modName(mid))}</span><span class="row"><button class="icon" data-a="tplModUp" data-i="${ti}" data-j="${mi}">↑</button><button class="icon" data-a="tplModDel" data-i="${ti}" data-j="${mi}">✕</button></span></div>`).join('')}
    <select data-ch="tplAddMod" data-i="${ti}" style="margin-top:8px"><option value="">+ Ajouter un module…</option>${db.modules.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select></div>`});
  h+=`<button class="btn ghost wide" data-a="addTpl">+ Ajouter une séance type</button><div class="row" style="margin-top:12px"><button class="btn wide" data-a="saveProgram">Enregistrer</button>${progById(d.id)?'<button class="btn danger ghost" data-a="delProgram">Supprimer</button>':''}</div>`;
  return h;
};
A.durType=el=>{S.draft.durType=el.dataset.v;render()};
A.addTpl=()=>{const n=S.draft.templates.length;S.draft.templates.push({id:uid(),name:'Séance '+String.fromCharCode(65+n),moduleIds:[]});render()};
A.delTpl=el=>{S.draft.templates.splice(+el.dataset.i,1);render()};
A.tplModUp=el=>{const t=S.draft.templates[+el.dataset.i],j=+el.dataset.j;if(j>0){[t.moduleIds[j-1],t.moduleIds[j]]=[t.moduleIds[j],t.moduleIds[j-1]];render()}};
A.tplModDel=el=>{S.draft.templates[+el.dataset.i].moduleIds.splice(+el.dataset.j,1);render()};

  const i=db.programs.findIndex(p=>p.id===d.id);if(i>=0)db.programs[i]=d;else db.programs.push(d);save();toast('Programme enregistré');go('programs')};

/* ================= Modules ================= */
V.modules=()=>`<button class="btn wide" data-a="newModule">+ Nouveau module</button><p class="xs muted">Un module est un bloc réutilisable (ex : « Haut du corps – Biceps / Triceps / Épaules »), composé d’exercices simples, de supersets ou de trisets.</p>`+
  db.modules.map(m=>`<div class="card"><h2 class="tap" data-a="editModule" data-id="${m.id}">${esc(m.name)}</h2>${m.tag?`<div class="xs muted">${esc(m.tag)}</div>`:''}<div class="sm">${m.blocks.map(b=>`<div class="li"><span class="tag t-${b.type}">${BLABEL[b.type]}</span> ${b.items.map(i=>esc(exById(i.exId)?.name||'?')+(i.rp?' <span class="rpx xs">⚡RP</span>':'')).join(' + ')} <div class="xs muted">${b.sets} ${b.type==='single'?'séries':'tours'} · ${restTxt(b)}</div></div>`).join('')}</div><div class="row wrap" style="margin-top:8px"><button class="btn sm" data-a="startMod" data-m="${m.id}">▶ Démarrer</button><button class="btn ghost sm" data-a="editModule" data-id="${m.id}">Modifier</button><button class="btn ghost sm" data-a="dupModule" data-id="${m.id}">Dupliquer</button></div></div>`).join('');
const newItem=()=>({exId:(db.exercises[0]||{}).id||'',reps:'12/10/échec',load:'',band:'',rp:'last',rpSec:db.settings.rpSec});
const newBlock=t=>({id:uid(),type:t,sets:3,rest:db.settings.defaultRest,restEnd:t==='single'?0:240,items:[]});
function normMod(d){d.blocks.forEach(b=>{const n=b.type==='circuit'?Math.max(2,b.items.length||4):(BTYPE[b.type]||1);while(b.items.length<n)b.items.push(newItem());if(b.type!=='circuit')b.items.length=n;b.items.forEach(it=>{if(!exById(it.exId))it.exId=(db.exercises[0]||{}).id;})})}
A.newModule=()=>{if(!db.exercises.length)return toast('Crée d’abord des exercices');S.draft={id:uid(),name:'',tag:'',blocks:[newBlock('triset')]};go('moduleEdit')};
A.editModule=el=>{S.draft=clone(db.modules.find(m=>m.id===el.dataset.id));go('moduleEdit')};
A.dupModule=el=>{const m=clone(db.modules.find(x=>x.id===el.dataset.id));m.id=uid();m.name+=' (copie)';m.blocks.forEach(b=>b.id=uid());db.modules.push(m);save();render();toast('Module dupliqué')};
V.moduleEdit=()=>{
  const d=S.draft;if(!d)return V.modules();normMod(d);
  let h=`<button class="link" data-a="go" data-v="modules">← Modules</button><div class="card"><label class="fld"><span>Nom du module</span><input data-f="name" value="${esc(d.name)}" placeholder="Ex : Haut du corps – Dos / Pecs / Abdos"></label><label class="fld"><span>Groupes musculaires / étiquette</span><input data-f="tag" value="${esc(d.tag||'')}"></label></div>`;
  d.blocks.forEach((b,bi)=>{
    h+=`<div class="card block"><div class="row sb"><select data-f="blocks.${bi}.type" data-rr style="max-width:180px">${Object.keys(BLABEL).map(k=>`<option value="${k}" ${b.type===k?'selected':''}>${BLABEL[k]}${k==='single'?'':k==='circuit'?' (4 exos et +)':' ('+BTYPE[k]+' exos)'}</option>`).join('')}</select><span class="row"><button class="icon" data-a="blkUp" data-i="${bi}">↑</button><button class="icon" data-a="blkDup" data-i="${bi}" title="Dupliquer">⧉</button><button class="icon" data-a="blkDel" data-i="${bi}" title="Supprimer">🗑</button></span></div>
    <div class="row"><label class="fld"><span>${b.type==='single'?'Séries':'Tours'}</span><input type="number" data-f="blocks.${bi}.sets" value="${b.sets}"></label><label class="fld"><span>Repos entre ${b.type==='single'?'séries':'tours'}</span><select data-f="blocks.${bi}.rest" data-num><option value="0" ${!+b.rest?'selected':''}>Aucun</option>${restOptions(b.rest)}</select></label><label class="fld"><span>Pause à la fin du bloc</span><select data-f="blocks.${bi}.restEnd" data-num><option value="0" ${!+b.restEnd?'selected':''}>Aucune</option>${restOptions(b.restEnd)}</select></label></div>`;
    b.items.forEach((it,ii)=>{const ex=exById(it.exId)||{};const P=`blocks.${bi}.items.${ii}`;
      h+=`<div class="item"><div class="sn">${b.type==='single'?'•':String.fromCharCode(65+ii)}</div><div class="grow"><div class="row"><select data-f="${P}.exId" data-rr>${exOptions(it.exId)}</select>${b.type==='circuit'&&b.items.length>2?`<button class="icon" data-a="itemDel" data-i="${bi}" data-j="${ii}">✕</button>`:''}</div>${ex.muscle?`<div class="mus">💪 ${muscLabel(ex)}${ex.type?' · '+(ex.type==='iso'?'Isolation':'Polyarticulaire'):''}</div>`:''}
      <div class="row"><label class="fld"><span>Objectif par ${b.type==='single'?'série':'tour'} (ex. 12/10/échec)</span><input data-f="${P}.reps" value="${esc(it.reps)}" placeholder="12/10/échec"></label>
      ${usesBands(ex)&&ex.mode!=='time'?`<label class="fld"><span>Élastiques de départ</span><input data-f="${P}.band" value="${esc(it.band||'')}" placeholder="ex. 25+10"></label>`:isBW(ex)&&ex.mode!=='time'?`<label class="fld"><span>Coef. ${ex.equip==='trx'?'TRX':'PDC'}</span><input type="number" step="0.05" data-f="${P}.load" value="${esc(it.load||1)}"></label>`:`<label class="fld"><span>${ex.mode==='time'?'Lest kg':isPl(ex)?'Plaques de départ':'Charge de départ kg'}</span><input type="number" step="any" data-f="${P}.load" value="${esc(it.load)}"></label>`}</div>
      <div class="row"><label class="fld"><span>Rest-pause (échec + pause + échec)</span><select data-f="${P}.rp" data-rr><option value="" ${!it.rp?'selected':''}>Non</option><option value="last" ${it.rp==='last'?'selected':''}>Dernière série uniquement</option><option value="all" ${it.rp&&it.rp!=='last'?'selected':''}>Chaque série</option></select></label>${it.rp?`<label class="fld" style="max-width:110px"><span>Pause (s)</span><input type="number" data-f="${P}.rpSec" value="${it.rpSec||db.settings.rpSec}"></label>`:''}</div></div></div>`});
    if(b.type==='circuit')h+=`<button class="btn ghost sm" data-a="itemAdd" data-i="${bi}" style="margin-top:8px">+ Exercice dans le circuit</button>`;
    h+='</div>'});
  h+=`<div class="row wrap"><button class="btn ghost" data-a="addBlk" data-v="single">+ Exercice simple</button><button class="btn ghost" data-a="addBlk" data-v="superset">+ Superset</button><button class="btn ghost" data-a="addBlk" data-v="triset">+ Triset</button><button class="btn ghost" data-a="addBlk" data-v="circuit">+ Circuit (4+)</button></div>
  <div class="row" style="margin-top:12px"><button class="btn wide" data-a="saveModule">Enregistrer le module</button>${db.modules.some(m=>m.id===d.id)?'<button class="btn danger ghost" data-a="delModule">Supprimer</button>':''}</div>`;
  return h;
};
A.addBlk=el=>{S.draft.blocks.push(newBlock(el.dataset.v));render();window.scrollTo(0,document.body.scrollHeight)};
A.blkUp=el=>{const i=+el.dataset.i,B=S.draft.blocks;if(i>0){[B[i-1],B[i]]=[B[i],B[i-1]];render()}};
A.blkDup=el=>{const i=+el.dataset.i,b=clone(S.draft.blocks[i]);b.id=uid();S.draft.blocks.splice(i+1,0,b);render()};
A.itemAdd=el=>{S.draft.blocks[+el.dataset.i].items.push(newItem());render()};
A.itemDel=el=>{S.draft.blocks[+el.dataset.i].items.splice(+el.dataset.j,1);render()};
A.blkDel=el=>{S.draft.blocks.splice(+el.dataset.i,1);render()};
A.saveModule=()=>{const d=S.draft;if(!String(d.name).trim())return toast('Donne un nom au module');if(!d.blocks.length)return toast('Ajoute au moins un bloc');
  d.blocks.forEach(b=>{b.sets=Math.max(1,+b.sets||1);b.rest=+b.rest||0;b.restEnd=+b.restEnd||0;b.items.forEach(it=>{it.rpSec=+it.rpSec||db.settings.rpSec})});
  const i=db.modules.findIndex(m=>m.id===d.id);if(i>=0)db.modules[i]=d;else db.modules.push(d);save();toast('Module enregistré');go('modules')};
A.delModule=()=>ask('Supprimer ce module ? Il sera retiré des programmes qui l’utilisent.','Supprimer').then(ok=>{if(!ok)return;const id=S.draft.id;db.modules=db.modules.filter(m=>m.id!==id);db.programs.forEach(p=>p.templates.forEach(t=>t.moduleIds=t.moduleIds.filter(x=>x!==id)));save();go('modules')});

/* ================= Exercices ================= */
V.exercises=()=>{
  const q=(S.exq||'').toLowerCase(),vw=S.exView||'mus';
  let h=`<div class="row" style="margin-bottom:10px"><input type="search" id="exq" placeholder="Rechercher un exercice…" value="${esc(S.exq)}"><button class="btn" data-a="editEx">+ Nouveau</button></div>
  <div class="seg">${[['mus','Par muscle'],['move','Par mouvement'],['eq','Par matériel']].map(([k,l])=>`<button class="${vw===k?'on':''}" data-a="exView" data-v="${k}">${l}</button>`).join('')}</div>
  <div class="chips" style="margin:-4px 0 10px"><button class="chip ${S.exType==='iso'?'on':''}" data-a="exType" data-v="iso">Isolation</button><button class="chip ${S.exType==='poly'?'on':''}" data-a="exType" data-v="poly">Polyarticulaire</button><button class="chip ${S.exHere?'on':''}" data-a="exHere">${curLoc().icon||''} Faisables : ${esc(curLoc().name)}</button><button class="chip" data-a="foldAll" data-v="0">⊞ Tout déplier</button><button class="chip" data-a="foldAll" data-v="1">⊟ Tout replier</button></div>`;
  const list=db.exercises.filter(e=>(e.name+' '+(e.sub||'')+' '+(e.move||'')).toLowerCase().includes(q)&&(!S.exHere||feasible(e))&&(!S.exType||e.type===S.exType));
  const row=e=>`<div class="li tap row sb" data-a="editEx" data-id="${e.id}"><span>${esc(e.name)}${vw==='move'?`<div class="xs muted">${muscLabel(e)}</div>`:vw==='eq'&&e.sub?`<div class="xs muted">${esc(e.sub)}</div>`:''}${e.sec&&e.sec.length?`<div class="xs muted">+ ${e.sec.map(s=>esc(s.replace('|',' › '))).join(', ')}</div>`:''}</span><span class="row" style="gap:4px">${e.type?`<span class="tag ${e.type==='iso'?'t-single':'t-superset'}">${e.type==='iso'?'Iso':'Poly'}</span>`:''}${(()=>{const t=[vw==='eq'?'':EQUIP[e.equip]||e.equip,e.anchor&&e.anchor!=='pieds'?ANCH[e.anchor].replace('Ancrage ',''):'',e.unit==='plaque'?'plaques':'',e.uni?'G/D':'',e.mode==='time'?'durée':''].filter(Boolean).join(' · ');return t?`<span class="tag">${t}</span>`:''})()}</span></div>`;
  const byName=(a,b)=>a.name.localeCompare(b.name);
  if(vw==='mus'){const g={};list.forEach(e=>{(g[e.muscle]=g[e.muscle]||{});(g[e.muscle][e.sub||'']=g[e.muscle][e.sub||'']||[]).push(e)});
    [...GROUPS(),...Object.keys(g).filter(m=>!GROUPS().includes(m))].forEach(m=>{if(!g[m])return;const subs=[...SUBS(m),...Object.keys(g[m]).filter(s=>!SUBS(m).includes(s))];
      const fg=isF('g|'+m);h+=`<div class="gh ${fg?'fold':''}" data-a="fold" data-v="${esc('g|'+m)}"><span class="fa">${fg?'▸':'▾'}</span>${esc(m)} <span class="muted">(${Object.values(g[m]).flat().length})</span></div>`;
      if(!fg)h+=`<div class="card list">${subs.filter(s=>g[m][s]).map(s=>{const k='s|'+m+'|'+s,fs=isF(k);return `<div class="sgh ${fs?'fold':''}" data-a="fold" data-v="${esc(k)}" ${s?'':'style="color:var(--mu)"'}><span class="fa">${fs?'▸':'▾'}</span>${s?esc(s):'Sous-groupe non précisé'} <span class="xs muted">(${g[m][s].length})</span></div>${fs?'':g[m][s].sort(byName).map(row).join('')}`}).join('')}</div>`})}
  else{const key=vw==='move'?(e=>e.move||'(sans mouvement)'):(e=>EQUIP[e.equip]||e.equip);const g={};list.forEach(e=>(g[key(e)]=g[key(e)]||[]).push(e));
    Object.keys(g).sort((a,b)=>a.localeCompare(b)).forEach(k=>{const fk=isF(vw+'|'+k);h+=`<div class="gh ${fk?'fold':''}" data-a="fold" data-v="${esc(vw+'|'+k)}"><span class="fa">${fk?'▸':'▾'}</span>${esc(k)} <span class="muted">(${g[k].length})</span></div>`;
      if(fk)return;
      if(vw==='eq'){const gm={};g[k].forEach(e=>(gm[e.muscle]=gm[e.muscle]||[]).push(e));
        h+=`<div class="card list">${[...GROUPS(),...Object.keys(gm).filter(m=>!GROUPS().includes(m))].filter(m=>gm[m]).map(m=>{const sk='eqm|'+k+'|'+m,fs=isF(sk);return `<div class="sgh ${fs?'fold':''}" data-a="fold" data-v="${esc(sk)}"><span class="fa">${fs?'▸':'▾'}</span>${esc(m)} <span class="xs muted">(${gm[m].length})</span></div>${fs?'':gm[m].sort(byName).map(row).join('')}`}).join('')}</div>`}
      else h+=`<div class="card list">${g[k].sort(byName).map(row).join('')}</div>`})}
  if(!list.length)h+='<div class="card muted">Aucun exercice ne correspond aux filtres.</div>';
  return h;
};
const hF=k=>!!(db.settings.fold||{})[k];
const isF=k=>!S.exq&&!!(db.settings.fold||{})[k];
A.fold=el=>{const f=db.settings.fold=db.settings.fold||{};const k=el.dataset.v;if(f[k])delete f[k];else f[k]=1;save();render()};
A.foldAll=el=>{const f={};if(el.dataset.v==='1'){db.exercises.forEach(e=>{f['g|'+e.muscle]=1;f['move|'+(e.move||'(sans mouvement)')]=1;f['eq|'+(EQUIP[e.equip]||e.equip)]=1})}db.settings.fold=f;save();render()};
A.exView=el=>{S.exView=el.dataset.v;render()};
A.exType=el=>{S.exType=S.exType===el.dataset.v?'':el.dataset.v;render()};
A.exHere=()=>{S.exHere=!S.exHere;render()};
A.editEx=el=>{const tpl=S.exTpl;S.exTpl=null;S.eMoveLast=null;const e=el.dataset.id?exById(el.dataset.id):tpl||{id:'',name:'',muscle:GROUPS()[0],sub:'',type:'iso',sec:[],equip:'halteres',mode:'reps',notes:'',move:'',anchor:''};const mus=GROUPS().includes(e.muscle)?GROUPS():[...GROUPS(),e.muscle];S.eSec=clone(e.sec||[]);
  modal(`<h3>${e.id?'Modifier l’exercice':tpl?'Nouvel exercice (copie)':'Nouvel exercice'}</h3><label class="fld"><span>Nom</span><input id="eName" value="${esc(e.name)}"></label>
  <label class="fld"><span>Mouvement (équivalences) — choisis un mouvement existant pour reprendre son classement</span><input id="eMove" list="moves" data-ch="eMoveCh" value="${esc(e.move||'')}" placeholder="ex. Face pull"><datalist id="moves">${[...new Set(db.exercises.map(x=>x.move).filter(Boolean))].sort().map(m=>`<option value="${esc(m)}">`).join('')}</datalist></label><div id="eSugg"></div>
  <div class="row"><label class="fld"><span>Groupe musculaire</span><select id="eMus" data-ch="eMusCh">${mus.map(m=>`<option ${m===e.muscle?'selected':''}>${esc(m)}</option>`).join('')}</select></label><label class="fld"><span>Sous-groupe (principal)</span><select id="eSub">${subOpts(e.muscle,e.sub)}</select></label></div>
  <div class="row"><label class="fld"><span>Type</span><select id="eType"><option value="iso">Isolation</option><option value="poly" ${e.type==='poly'?'selected':''}>Polyarticulaire</option></select></label><label class="fld"><span>Matériel</span><select id="eEq">${Object.entries(EQUIP).map(([k,l])=>`<option value="${k}" ${k===e.equip?'selected':''}>${l}</option>`).join('')}</select></label></div>
  <div class="fld"><span>Muscles secondaires (comptent pour ${fmtNum(db.settings.secW)} série)</span><div id="eSecList" class="chips">${secHtml()}</div><select data-ch="eSecAdd"><option value="">+ Ajouter un muscle secondaire…</option>${GROUPS().map(g=>`<optgroup label="${esc(g)}"><option value="${esc(g)}">${esc(g)} (tout le groupe)</option>${SUBS(g).map(s=>`<option value="${esc(g+'|'+s)}">${esc(g)} › ${esc(s)}</option>`).join('')}</optgroup>`).join('')}</select></div>
  <div class="row"><label class="fld"><span>Ancrage</span><select id="eAnch">${Object.entries(ANCH).map(([k,l])=>`<option value="${k}" ${k===(e.anchor||'')?'selected':''}>${l}</option>`).join('')}</select></label></div>
  <label class="fld"><span>Unité de charge</span><select id="eUnit"><option value="">kg</option><option value="plaque" ${e.unit==='plaque'?'selected':''}>Plaques (poulie / machine)</option></select></label>
  <div class="row"><label class="fld"><span>Mesure</span><select id="eMode"><option value="reps">Répétitions</option><option value="time" ${e.mode==='time'?'selected':''}>Durée (s)</option></select></label><label class="chk" style="flex:1"><input type="checkbox" id="eUni" ${e.uni?'checked':''}> Unilatéral (G puis D)</label></div>
  <label class="fld"><span>Notes / consignes / réglages</span><textarea id="eNotes" rows="2">${esc(e.notes)}</textarea></label>
  <details style="margin:6px 0 10px"><summary class="sm" style="cursor:pointer;color:var(--ac2)">❓ Comment classer un exercice ?</summary><div class="xs" style="line-height:1.55;margin-top:6px">
  <b>Iso ou Poly :</b> une seule articulation bouge → <b>Isolation</b> (curl, élévation, leg curl, extension). Plusieurs → <b>Polyarticulaire</b> (développé, rowing, tractions, squat, fentes, soulevé de terre) : ajoute alors des secondaires.<br>
  <b>Muscle principal :</b> celui qui brûle et lâche en premier.<br>
  <b>Pousser</b> : horizontal → Pecs milieu · incliné → Pecs haut · décliné / dips → Pecs bas · au-dessus de la tête → Épaules antérieur (secondaires : Triceps, Épaules antérieur).<br>
  <b>Tirer</b> : vers le bas → Grand dorsal · vers le ventre → Trapèzes moyens / rhomboïdes · vers le visage coudes hauts → Épaules postérieur (secondaires : Biceps, Épaules postérieur).<br>
  <b>Épaules</b> : élévation latérale → Latéral · frontale → Antérieur · shrug → Trapèzes sup.<br>
  <b>Biceps</b> : bras derrière le corps → Chef long · bras devant (pupitre, concentration) → Chef court · prise marteau → Brachial (+ Brachio-radial).<br>
  <b>Triceps</b> : bras au-dessus de la tête → Chef long · bras le long du corps (poulie haute) → Chef latéral.<br>
  <b>Jambes</b> : squat / fentes / presse → Quadriceps (+ Fessiers) · leg curl, SDT jambes tendues → Ischios · pont / hip thrust → Grand fessier · abduction → Moyen fessier.<br>
  <b>Abdos</b> : crunch / relevés → Grand droit · rotations → Obliques · gainage / roller → Transverse.<br>
  Rien n’est figé : corriger un exercice ne change pas son historique.</div></details>
  <div class="row wrap"><button class="btn" data-a="saveEx" data-id="${e.id}">Enregistrer</button>${e.id?`<button class="btn ghost" data-a="dupEx" data-id="${e.id}">⧉ Dupliquer</button><button class="btn danger ghost" data-a="delEx" data-id="${e.id}">Supprimer</button>`:''}<button class="btn ghost" data-a="closeModal">Annuler</button></div>`)};
const subOpts=(g,sel)=>`<option value="">— non précisé —</option>`+SUBS(g).map(s=>`<option ${s===sel?'selected':''}>${esc(s)}</option>`).join('')+(sel&&!SUBS(g).includes(sel)?`<option selected>${esc(sel)}</option>`:'');
const secHtml=()=>(S.eSec||[]).map((s,i)=>`<button class="chip" data-a="eSecDel" data-i="${i}">${esc(s.replace('|',' › '))} ✕</button>`).join('')||'<span class="xs muted">Aucun</span>';
A.eMoveCh=el=>{const v=el.value.trim();const box=$('#eSugg');if(!box||S.eMoveLast===v)return;S.eMoveLast=v;const cur=$('#eName').value.trim();const src=db.exercises.find(x=>x.move&&x.move.toLowerCase()===v.toLowerCase()&&x.name!==cur&&x.sub)||null;
  box.innerHTML=src?`<div class="note sm" style="margin:-2px 0 8px">Classement de « ${esc(src.name)} » : <b>${muscLabel(src)}</b> · ${TYPE[src.type]||''}${src.sec&&src.sec.length?' · + '+src.sec.map(s=>esc(s.replace('|',' › '))).join(', '):''}<div style="margin-top:6px"><button class="btn sm" data-a="eApply" data-id="${src.id}">Reprendre ce classement</button></div></div>`:''};
A.eApply=el=>{const s=exById(el.dataset.id);if(!s)return;$('#eMus').value=s.muscle;$('#eSub').innerHTML=subOpts(s.muscle,s.sub);$('#eType').value=s.type||'iso';S.eSec=clone(s.sec||[]);$('#eSecList').innerHTML=secHtml();$('#eSugg').innerHTML='<div class="xs hint" style="margin:-2px 0 8px">✓ Classement repris : vérifie et ajuste si besoin.</div>'};
A.dupEx=el=>{const s=clone(exById(el.dataset.id));s.id='';s.name+=' (copie)';S.exTpl=s;A.editEx({dataset:{}});setTimeout(()=>{const n=$('#eName');if(n){n.focus();n.select()}},50)};
A.eMusCh=el=>{$('#eSub').innerHTML=subOpts(el.value,'')};
A.eSecAdd=el=>{if(el.value&&!S.eSec.includes(el.value))S.eSec.push(el.value);el.value='';$('#eSecList').innerHTML=secHtml()};
A.eSecDel=el=>{S.eSec.splice(+el.dataset.i,1);$('#eSecList').innerHTML=secHtml()};
A.saveEx=el=>{const name=$('#eName').value.trim();if(!name)return toast('Donne un nom');const o={name,muscle:$('#eMus').value,sub:$('#eSub').value,type:$('#eType').value,sec:clone(S.eSec||[]),unit:$('#eUnit').value,equip:$('#eEq').value,mode:$('#eMode').value,uni:$('#eUni').checked,move:$('#eMove').value.trim(),anchor:$('#eAnch').value,notes:$('#eNotes').value.trim()};
  if(el.dataset.id)Object.assign(exById(el.dataset.id),o);else db.exercises.push({id:uid(),...o});save();closeModal();render();toast('Exercice enregistré')};
A.delEx=el=>{const id=el.dataset.id;if(db.modules.some(m=>m.blocks.some(b=>b.items.some(i=>i.exId===id))))return toast('Exercice utilisé dans un module : retire-le d’abord');ask('Supprimer cet exercice ? (l’historique est conservé)','Supprimer').then(ok=>{if(ok){db.exercises=db.exercises.filter(e=>e.id!==id);save();render()}})};

/* ================= Réglages & données ================= */
V.settings=()=>{const st=db.settings;return `<div class="card"><div class="k">Lieux et matériel</div><p class="xs muted">Les exercices non faisables sont remplacés automatiquement par un équivalent (même « mouvement »).</p>${st.locations.map((l,li)=>`<div class="li"><div class="row"><input id="lic-${li}" value="${esc(l.icon||'')}" style="max-width:58px"><input id="lnm-${li}" value="${esc(l.name)}"></div><div class="chips">${Object.keys(EQUIP).filter(k=>k!=='pdc').map(k=>`<label class="chip"><input type="checkbox" class="leq" data-l="${li}" value="${k}" ${l.equip.includes(k)?'checked':''}> ${EQUIP[k]}</label>`).join('')}${['haut','median','bas'].map(k=>`<label class="chip"><input type="checkbox" class="lan" data-l="${li}" value="${k}" ${(l.anchors||[]).includes(k)?'checked':''}> ${ANCH[k]}</label>`).join('')}</div></div>`).join('')}<button class="btn ghost sm" data-a="addLoc" style="margin-top:8px">+ Lieu</button></div>
<div class="card"><div class="k">Élastiques (kit SmartWorkout)</div><p class="xs muted">Nom = ce que tu tapes en séance (ex. « 25+10 »), kg = résistance, × = nombre possédé. Les combinaisons s’additionnent.</p>${st.bands.map((b,i)=>`<div class="row" style="margin-bottom:6px"><input id="bn-${i}" value="${esc(b.name)}"><input id="bk-${i}" type="number" step="0.5" value="${b.kg}" style="max-width:80px"><span class="xs muted">kg ×</span><input id="bq-${i}" type="number" value="${b.n||1}" style="max-width:60px"><button class="icon" data-a="delBand" data-i="${i}">✕</button></div>`).join('')}<button class="btn ghost sm" data-a="addBand" style="margin-top:8px">+ Élastique</button></div>
<div class="card"><div class="k">Calculs</div><div class="row"><label class="fld"><span>Formule du 1RM estimé</span><select id="sRmF"><option value="epley" ${st.rmF==='epley'?'selected':''}>Epley</option><option value="brzycki" ${st.rmF==='brzycki'?'selected':''}>Brzycki</option><option value="avg" ${st.rmF==='avg'?'selected':''}>Moyenne des deux</option></select></label><label class="fld"><span>Poids d’un muscle secondaire</span><select id="sSecW">${[[0,'0 (principal seul)'],[0.25,'¼ série'],[0.5,'½ série']].map(([v,l])=>`<option value="${v}" ${+st.secW===v?'selected':''}>${l}</option>`).join('')}</select></label></div><p class="xs muted">Les formules sont fiables jusqu’à ~12 reps ; au-delà, le 1RM est surtout un indice de progression.</p></div>
<div class="card"><div class="k">Groupes et sous-groupes musculaires</div><p class="xs muted">Une ligne par groupe : « Groupe : sous-groupe, sous-groupe… ». Renommer un sous-groupe ne modifie pas les exercices déjà classés.</p><textarea id="sTree" rows="12" style="font-size:14px">${esc(Object.entries(st.muscleTree).map(([g,s])=>g+' : '+s.join(', ')).join('\n'))}</textarea></div>
<div class="card"><div class="k">Reprise après une pause</div><div class="row"><label class="fld"><span>Pause déclenchant la reprise (jours)</span><input id="sRsD" type="number" value="${st.resumeDays}"></label><label class="fld"><span>Réduction des charges (%)</span><input id="sRsP" type="number" value="${st.resumePct}"></label><label class="fld"><span>Séances de reprise</span><select id="sRsN"><option value="1" ${+st.resumeN===1?'selected':''}>1</option><option value="2" ${+st.resumeN!==1?'selected':''}>2 (la 2ᵉ à −moitié)</option></select></label></div><p class="xs muted">0 jour = mode reprise désactivé.</p></div>
<div class="card"><div class="k">Chrono</div><label class="fld"><span>Temps prédéfinis (secondes, séparés par des virgules)</span><input id="sTimers" value="${st.timers.join(', ')}"></label><div class="row"><label class="fld"><span>Repos par défaut (s)</span><input id="sRest" type="number" value="${st.defaultRest}"></label><label class="fld"><span>Rest-pause par défaut (s)</span><input id="sRp" type="number" value="${st.rpSec}"></label></div>
<div class="fld"><span class="k" style="margin:0">Sonneries</span></div>
<label class="fld"><span>Fin du repos / de la pause</span><div class="row"><select id="sSndRest">${Object.entries(SOUNDS).map(([k,v])=>`<option value="${k}" ${st.sndRest===k?'selected':''}>${v.label}</option>`).join('')}</select><button class="icon" data-a="sndTest" data-t="sSndRest" data-s="S" title="Écouter">▶</button></div></label>
<label class="fld"><span>Fin du rest-pause (pause courte)</span><div class="row"><select id="sSndRp">${Object.entries(SOUNDS).map(([k,v])=>`<option value="${k}" ${st.sndRp===k?'selected':''}>${v.label}</option>`).join('')}</select><button class="icon" data-a="sndTest" data-t="sSndRp" data-s="S" title="Écouter">▶</button></div></label>
<label class="fld"><span>Décompte 3-2-1</span><div class="row"><select id="sSndTick">${Object.entries(TICKS).map(([k,v])=>`<option value="${k}" ${st.sndTick===k?'selected':''}>${v.label}</option>`).join('')}</select><button class="icon" data-a="sndTest" data-t="sSndTick" data-s="T" title="Écouter">▶</button></div></label>
<label class="fld"><span>Volume : <b id="sVolV">${st.vol}</b> %</span><input type="range" id="sVol" min="10" max="100" step="5" value="${st.vol}" style="padding:0"></label>
<p class="xs muted">Sur iPhone, le bouton silencieux coupe ces sons ; écran verrouillé, ils ne sonnent qu’au retour dans l’appli.</p>
<label class="chk"><input type="checkbox" id="sSound" ${st.sound?'checked':''}> Bips sonores (3-2-1 puis fin)</label><label class="chk"><input type="checkbox" id="sVib" ${st.vibrate?'checked':''}> Vibration à la fin (Android)</label><label class="chk"><input type="checkbox" id="sWake" ${st.wake?'checked':''}> Garder l’écran allumé pendant la séance</label><button class="btn" data-a="saveSettings">Enregistrer les réglages</button></div>
<div class="card"><div class="k">Affichage</div><label class="fld"><span>Mise en page</span><select id="sLayout"><option value="auto" ${st.layout==='auto'?'selected':''}>Automatique (large seulement avec souris sur grand écran : DeX, PC)</option><option value="mobile" ${st.layout==='mobile'?'selected':''}>Toujours mobile (1 colonne)</option><option value="wide" ${st.layout==='wide'?'selected':''}>Toujours large (multicolonne)</option></select></label><label class="fld"><span>Taille du texte</span><select id="sFs"><option value="n" ${st.fs==='n'?'selected':''}>Normale</option><option value="l" ${st.fs==='l'?'selected':''}>Grande (+10 %)</option><option value="xl" ${st.fs==='xl'?'selected':''}>Très grande (+20 %)</option></select></label></div>
<div class="card"><div class="k">Données</div><p class="xs muted">Tout est stocké sur cet appareil. Dernière sauvegarde : <b>${st.lastBackup?fmtDateLong(st.lastBackup):'jamais'}</b>. « Envoyer vers OneDrive » ouvre le menu de partage du téléphone : choisis OneDrive, le dossier, et c’est fait.</p><div class="row wrap"><button class="btn" data-a="shareBackup">☁ Envoyer la sauvegarde (OneDrive…)</button><button class="btn ghost" data-a="exportJson">⬇ Télécharger (.json)</button><button class="btn ghost" data-a="importJson">⬆ Restaurer</button><button class="btn ghost" data-a="exportCsv">⬇ Export Excel (.csv)</button></div><input type="file" id="fImport" data-ch="doImport" accept=".json,.txt,application/json,text/plain" hidden><button class="btn danger ghost sm" data-a="resetAll" style="margin-top:14px">Revenir aux données de départ (import Excel)</button></div>
<div class="card"><div class="k">À propos</div><div><b>Muscu Progress v${APP_VERSION}</b> <span class="xs muted">· ${APP_DATE}</span></div><details style="margin-top:8px"><summary class="sm" style="cursor:pointer">Nouveautés des versions</summary>${CHANGELOG.map(([v,d,l])=>`<div style="margin-top:8px"><b class="sm">v${v}</b> <span class="xs muted">${d}</span><ul class="sm" style="margin:4px 0 0;padding-left:18px">${l.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`).join('')}</details></div>
<p class="xs muted">${db.sessions.length} séances · ${db.exercises.length} exercices · ${db.modules.length} modules · ${db.programs.length} programmes</p>`};
function readBands(){db.settings.bands=db.settings.bands.map((b,i)=>({name:($(`#bn-${i}`)?.value||b.name).trim(),kg:+($(`#bk-${i}`)?.value??b.kg)||0,n:+($(`#bq-${i}`)?.value??b.n)||1})).filter(b=>b.name);
  db.settings.locations.forEach((l,li)=>{const n=$(`#lnm-${li}`);if(!n)return;l.name=n.value.trim()||l.name;l.icon=$(`#lic-${li}`).value.trim();l.equip=[...document.querySelectorAll(`.leq[data-l="${li}"]:checked`)].map(x=>x.value);l.anchors=[...document.querySelectorAll(`.lan[data-l="${li}"]:checked`)].map(x=>x.value)})}
A.addLoc=()=>{readBands();db.settings.locations.push({id:uid(),name:'Hôtel',icon:'🏨',equip:['elastique'],anchors:[]});render()};
A.addBand=()=>{readBands();db.settings.bands.push({name:'Nouvel élastique',kg:0,n:1});render()};
A.delBand=el=>{readBands();db.settings.bands.splice(+el.dataset.i,1);render()};
A.sndTest=el=>{const k=$('#'+el.dataset.t).value,v=$('#sVol');const old=db.settings.vol,os=db.settings.sound;db.settings.vol=+v.value;db.settings.sound=true;playSnd(k,el.dataset.s==='T'?TICKS:SOUNDS);db.settings.vol=old;db.settings.sound=os};
A.saveSettings=()=>{readBands();const st=db.settings;const tm=$('#sTimers').value.split(/[,; ]+/).map(Number).filter(x=>x>0);if(tm.length)st.timers=[...new Set(tm)].sort((a,b)=>a-b);st.defaultRest=+$('#sRest').value||90;st.rpSec=+$('#sRp').value||15;st.sound=$('#sSound').checked;st.vibrate=$('#sVib').checked;st.wake=$('#sWake').checked;st.rmF=$('#sRmF').value;st.layout=$('#sLayout').value;st.fs=$('#sFs').value;st.sndRest=$('#sSndRest').value;st.sndRp=$('#sSndRp').value;st.sndTick=$('#sSndTick').value;st.vol=+$('#sVol').value;st.resumeDays=+$('#sRsD').value||0;st.resumePct=+$('#sRsP').value||0;st.resumeN=+$('#sRsN').value||1;st.secW=+$('#sSecW').value;
  const tr={};$('#sTree').value.split('\n').forEach(l=>{const i=l.indexOf(':');const g=(i<0?l:l.slice(0,i)).trim();if(!g)return;tr[g]=i<0?[]:l.slice(i+1).split(',').map(x=>x.trim()).filter(Boolean)});if(Object.keys(tr).length)st.muscleTree=tr;save();applyLayout();render();toast('Réglages enregistrés')};
A.exportJson=()=>{download(`muscu-sauvegarde-${today()}.json`,JSON.stringify(db,null,1),'application/json');db.settings.lastBackup=Date.now();save();render()};
A.shareBackup=async()=>{const txt=JSON.stringify(db);const name=`muscu-sauvegarde-${today()}`;const tries=[new File([txt],name+'.json',{type:'application/json'}),new File([txt],name+'.txt',{type:'text/plain'})];
  for(const f of tries){try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Sauvegarde Muscu Progress'});db.settings.lastBackup=Date.now();save();render();toast('Sauvegarde envoyée ✓');return}}catch(e){if(e&&e.name==='AbortError')return}}
  A.exportJson();toast('Partage indisponible : fichier téléchargé, dépose-le dans OneDrive')};
function backupDue(){const lb=+db.settings.lastBackup||0;const since=db.sessions.filter(s=>s.end>lb).length;if(!db.sessions.length||!since)return null;const days=lb?Math.floor((Date.now()-lb)/864e5):null;if(!lb||since>=3||days>=7)return {since,days};return null}
A.importJson=()=>$('#fImport').click();
A.doImport=el=>{const f=el.files&&el.files[0];if(!f)return;f.text().then(t=>{let d;try{d=JSON.parse(t)}catch(e){return toast('Fichier invalide')}if(!d||!Array.isArray(d.exercises))return toast('Ce fichier n’est pas une sauvegarde Muscu Progress');
  ask(`Remplacer les données de cet appareil par cette sauvegarde (${(d.sessions||[]).length} séances) ?`,'Remplacer').then(ok=>{if(ok){db=migrate(d);db.settings.lastBackup=Date.now();save();go('home');toast('Données restaurées')}})});el.value=''};
A.exportCsv=()=>{
  const rows=[['Date','Heure','Séance','Programme','Bloc','Type','Tour','Exercice','Groupe','Matériel','Reps','Charge','Unité','Élastique','Reps rest-pause','Kg équivalent (élastiques)','Volume (charge × reps)']];
  db.sessions.forEach(s=>s.blocks.forEach((b,bi)=>b.log.forEach((r,ri)=>r.forEach(st=>{if(!st)return;const ex=exById(st.exId)||{};const kg=effKg(st);const rpT=(st.rp||[]).reduce((a,c)=>a+c,0);
    rows.push([new Date(s.start).toLocaleDateString('fr-FR'),new Date(s.start).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}),s.name,progName(s.programId),bi+1,BLABEL[b.type],ri+1,ex.name||'',ex.muscle||'',EQUIP[ex.equip]||'',st.reps,st.load||'',isPl(ex)?'plaques':usesBands(ex)?'':isBW(ex)?'coef':'kg',st.band||'',(st.rp||[]).join('+'),usesBands(ex)?kg:'',kind(ex)==='load'?kg*((+st.reps||0)+rpT):''])}))));
  const csv='﻿'+rows.map(r=>r.map(c=>{if(typeof c==='number')return String(Math.round(c*100)/100).replace('.',',');c=String(c??'');return /[;"\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(';')).join('\r\n');
  download(`muscu-series-${today()}.csv`,csv,'text/csv;charset=utf-8')};
A.resetAll=()=>ask('Effacer toutes les données et revenir aux données de départ (programme et séances importés de ton Excel) ? Pense à exporter une sauvegarde avant.','Tout effacer').then(ok=>{if(ok){db=seed();save();go('home')}});

/* ================= Évènements ================= */
document.addEventListener('click',e=>{unlockAudio();const m=$('#modal');if(e.target===m){closeModal();return}const el=e.target.closest('[data-a]');if(!el)return;const fn=A[el.dataset.a];if(fn){e.preventDefault();fn(el,e)}});
document.addEventListener('change',e=>{const el=e.target;
  if(el.dataset.ch){A[el.dataset.ch]&&A[el.dataset.ch](el);return}
  if(el.dataset.f&&S.draft){setPath(S.draft,el.dataset.f,val(el));if('rr' in el.dataset)render()}});
document.addEventListener('input',e=>{const el=e.target;
  if(/^l-\d+-\d+b$/.test(el.id)){const k=$('#'+el.id.slice(0,-1)+'k');if(k)k.textContent=el.value?'= '+fmtNum(bandKg(el.value))+' kg':'';return}
  if(['plS','plR','plP'].includes(el.id)){S[el.id]=el.value===''?'':+el.value;const o=$('#plOut');o.innerHTML=planOut(+o.dataset.vol,o.dataset.kind,o.dataset.u);return}
  if(el.id==='sVol'){$('#sVolV').textContent=el.value;return}
  if(el.id==='exq'){S.exq=el.value;render();const q=$('#exq');q.focus();q.setSelectionRange(q.value.length,q.value.length);return}
  if(el.dataset.f&&S.draft&&el.tagName!=='SELECT'&&el.type!=='checkbox')setPath(S.draft,el.dataset.f,val(el))});

if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
function applyLayout(){document.body.classList.toggle('fs-l',db.settings.fs==='l');document.body.classList.toggle('fs-xl',db.settings.fs==='xl');const L=db.settings.layout||'auto';const auto=matchMedia('(min-width:1000px) and (hover:hover) and (pointer:fine)').matches;const w=L==='wide'||(L==='auto'&&auto);document.body.classList.toggle('wide',w);document.body.classList.toggle('xwide',w&&innerWidth>=1500)}
addEventListener('resize',applyLayout);applyLayout();
const prevV=db.settings.appVersion;db.settings.appVersion=APP_VERSION;save();
S.view=db.active?'workout':'home';if(db.active)wake(true);render();
if(prevV&&prevV!==APP_VERSION)setTimeout(()=>toast(`✓ Mise à jour installée : v${APP_VERSION}`),400);
</script>
</body>
</html>

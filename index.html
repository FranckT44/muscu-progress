<style>

.tag.on{color:var(--ok);border-color:#1f5a40}.tag.t-triset{color:#c9a2ff;border-color:#4b3a6e}.tag.t-superset{color:#7cc7ff;border-color:#2b4d66}.tag.t-single{color:var(--ac2)}.chip.on{background:var(--ac);color:#1a0d02;border-color:var(--ac);font-weight:600}.sw{min-width:30px;height:28px;font-size:13px;margin-left:6px;vertical-align:middle}.bchips{display:flex;flex-wrap:wrap;gap:5px;margin:2px 0 6px 24px}.bc{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:6px 9px;font-size:13px;cursor:pointer}.scroll{overflow-x:auto}.heat{font-size:12px}.heat td,.heat th{text-align:center;min-width:30px;padding:5px 2px}.heat td:first-child{min-width:70px}.tag.t-circuit{color:#7ee0c3;border-color:#265a4b}

.fld{display:flex;flex-direction:column;gap:4px;margin:6px 0;flex:1;min-width:0}.fld>span{font-size:14.5px;font-weight:600;color:#b8bfcc}

.setrow{display:flex;gap:6px;align-items:flex-end}.sn{width:18px;font-weight:700;color:var(--ac);padding-bottom:14px;flex:none}

.seg{display:flex;background:var(--card2);border-radius:11px;padding:3px;gap:3px;margin-bottom:12px}.seg button{flex:1;background:none;border:0;color:var(--mu);padding:8px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}.seg button.on{background:var(--ac);color:#1a0d02}
#tbar{position:fixed;left:10px;right:10px;bottom:calc(60px + env(safe-area-inset-bottom));z-index:7;background:#1d2129;border:1px solid var(--ac);border-radius:16px;padding:10px 14px;max-width:700px;margin:0 auto;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.tb-top{display:flex;justify-content:space-between;align-items:baseline}#tlabel{font-weight:600;color:var(--ac2)}#ttime{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums}

#resume{position:fixed;left:50%;transform:translateX(-50%);top:calc(60px + env(safe-area-inset-top));z-index:6;background:var(--ok);color:#04140c;border:0;border-radius:999px;padding:9px 16px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.4);cursor:pointer}

.v3d{height:min(46vh,340px);border-radius:14px;background:#e9e7e2;margin:8px 0 4px;touch-action:pan-y;overflow:hidden;cursor:grab}.v3d canvas{display:block;width:100%!important;height:100%!important}.lg{display:flex;flex-wrap:wrap;gap:6px 14px;margin:8px 0 12px}.lg i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.card.cf>:not(.k){display:none!important}.card.cf{padding-bottom:12px}.k.sfh{cursor:pointer;user-select:none;display:flex;align-items:center;gap:2px}.k.sfh .fa{font-size:14px;padding:0 6px 0 0;width:18px}
.pvh{margin:18px 0 6px;padding:9px 12px;border-left:5px solid var(--c);border-radius:8px;background:rgba(255,255,255,.06);color:var(--c);font-size:17px;font-weight:800;line-height:1.25;display:flex;gap:10px;align-items:center}.pvh .pvn{flex:none;width:26px;height:26px;border-radius:50%;background:var(--c);color:#111;font-size:14px;display:flex;align-items:center;justify-content:center}.pvm{margin:2px 0 4px 6px;padding-left:10px;border-left:2px solid var(--c);font-size:13px;color:#d6d9df}
.edset{cursor:pointer}.edset .edp{opacity:.45;font-size:11px}.edset:hover{background:rgba(255,255,255,.06)}
.chip.trans{margin:6px 0 2px 34px;padding:4px 12px;font-size:13px;border-color:var(--ac);color:var(--ac)}
header.top .topb{min-width:50px;height:46px;font-size:24px;border-radius:12px;margin-left:8px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 10px}header.top .topb span{font-size:14px;font-weight:700}@media (max-width:560px){header.top .topb span{display:none}}
.demo-b.eye{font-size:20px;line-height:1;padding:3px 7px;margin:0 2px 0 6px;vertical-align:middle;border-radius:9px;background:var(--card2);border:1px solid var(--line)}.demo-b.eye:hover{border-color:var(--ac)}
.demo-b{background:none;border:0;font-size:22px;padding:2px 6px;cursor:pointer;color:inherit}button.icon[data-a=demo]{font-size:21px;min-width:40px}button.icon.sw[data-a=demo]{height:34px;min-width:42px;font-size:21px}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.grid button{padding:16px 4px;font-size:16px;font-weight:700;background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:12px;cursor:pointer}

svg.chart{width:100%;height:auto;display:block}
.chart .ln{fill:none;stroke:var(--ac);stroke-width:2.5;stroke-linejoin:round}.chart .pt{fill:var(--ac)}.chart .gr{stroke:var(--line)}.chart text{fill:var(--mu);font-size:10px}
.note{background:var(--card2);padding:8px;border-radius:8px;margin-top:6px}
.exr{padding:10px 0;border-top:1px solid var(--line)}.mini{display:flex;gap:16px;flex-wrap:wrap;margin-top:4px;font-size:13px}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl th{text-align:left;color:var(--mu);font-weight:600;font-size:11px}.tbl td,.tbl th{padding:6px 4px;border-top:1px solid var(--line);vertical-align:top}
[hidden]{display:none!important}
body.fs-l{zoom:1.1}body.fs-xl{zoom:1.2}
.mus{display:inline-block;font-size:12px;font-weight:600;color:var(--ac2);background:rgba(255,138,61,.12);border:1px solid rgba(255,138,61,.35);border-radius:6px;padding:2px 7px;margin:4px 0 2px}
.seg.big{padding:4px;gap:4px;margin-bottom:14px}.seg.big button{padding:10px 4px;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:3px;border:1px solid transparent}.seg.big button:not(.on){border-color:var(--line);background:var(--card)}.seg.big button b{font-size:22px;font-weight:400}
.fh{display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none}.fh .k{margin:0}.fh .fa{color:var(--ac);font-size:18px;padding:0 2px 0 12px}
.gh .fa,.sgh .fa{display:inline-block;width:24px;color:var(--ac)}
.gh{cursor:pointer;user-select:none;font-size:22px;font-weight:800;color:var(--tx);margin:22px 0 10px;padding:4px 0 6px 12px;border-left:5px solid var(--ac);letter-spacing:.01em;break-after:avoid}.gh .muted{font-size:15px;font-weight:600}
.sgh{cursor:pointer;user-select:none;font-size:15px;font-weight:700;color:var(--ac2);padding:12px 0 2px;border-bottom:1px solid var(--line)}
.wgrid{display:flex;flex-direction:column}.wmain,.wside{display:contents}
body.wide main{max-width:1320px;padding:16px 24px 190px}

body.wide .cols>.seg,body.wide .cols>select,body.wide .cols>.row,body.wide .cols>.chips,body.wide .cols>.full,body.wide .cols>.link,body.wide .cols>.btn.wide,body.wide .cols>p{column-span:all}

#tnext{margin:6px 0 2px;line-height:1.35;color:#cfd3da}#tnext b{color:#fff}#tnext .chg{color:var(--ac);font-weight:700}

</style>

<script>
'use strict';
const APP_VERSION='2.13.7',APP_DATE='21/11/2026';
const CHANGELOG=[
 ['2.13.7','21/11/2026',['Réglages : chaque modification est enregistrée et appliquée automatiquement (plus besoin de toucher « Enregistrer »)']],
 ['2.13.6','21/11/2026',['Réglages : tuiles classées par ordre alphabétique']],
 ['2.13.5','21/11/2026',['Affichage multicolonne automatique aussi en mode DeX et sur tablette en paysage (écran d’au moins 1100 px)','Le choix d’affichage (auto / mobile / large) est propre à chaque appareil et n’est plus transmis par les sauvegardes']],
 ['2.13.4','21/11/2026',['Boutons Chrono ⏱ et Réglages ⚙ en haut de l’écran agrandis (avec leur nom sur grand écran)']],
 ['2.13.3','21/11/2026',['« Overhead press » devient « Arnold press (haltères) » : + Épaules postérieures en secondaire, animation avec rotation (coudes devant, haltères face au visage → bras tendus au-dessus de la tête) ; historique conservé']],
 ['2.13.2','21/11/2026',['Saisie : pour les exercices en G/D (un côté puis l’autre), le champ indique « Reps par côté » pour éviter de saisir le total des deux côtés']],
 ['2.13.1','21/11/2026',['Circuit : sous chaque exercice (sauf le dernier du tour), bouton « ⏱ 25 s → exercice suivant » qui lance une courte récupération ; durée réglable dans Réglages → Chrono (« Transition en circuit »)']],
 ['2.13.0','21/11/2026',['Nouvel exercice « Tirage poulie basse pecs à genoux, un bras » (avec ton ancien historique et une animation à genoux) ; il reprend sa place dans WO 1 · Série 2 pour poursuivre la progression','« Tirage poulie basse (pecs) » debout, deux bras, reste disponible comme exercice séparé (avec la séance du 21/11)']],
 ['2.12.12','21/11/2026',['Tirage poulie basse (pecs) : l’ancien historique (un bras à la fois, charges d’origine) est rangé dans un exercice séparé « Tirage poulie basse (pecs) — un bras (ancien) » ; l’exercice actuel (deux bras en même temps) repart de la séance du jour']],
 ['2.12.11','21/11/2026',['Séance en cours : chaque série déjà validée se corrige d’un tap dans le tableau du bloc (✎) — répétitions, charge / plaques / coef. / élastiques, reps de rest-pause, ou effacer']],
 ['2.12.10','21/11/2026',['Historique : Overhead press converti en charge par haltère (anciennes valeurs ÷ 2) ; Tirage poulie basse (pecs) passé à deux mains (anciennes valeurs × 2, plus en G/D)']],
 ['2.12.9','21/11/2026',['Modes Force / Hypertrophie / Endurance et séries égales : les exercices au poids du corps (tractions, pompes, fentes, TRX…) gardent les objectifs du programme au lieu d’un 8 / 12 / 15 imposé']],
 ['2.12.8','21/11/2026',['Aperçu de séance : titres des modules plus grands, numérotés et colorés (une couleur par module), type de bloc / tours / repos plus lisibles']],
 ['2.12.7','21/11/2026',['Séance en cours : un bloc ouvert avec « Afficher ce bloc » se referme avec « ▴ Masquer ce bloc » (en haut et en bas du bloc)']],
 ['2.12.6','21/11/2026',['Pendant le repos : la barre du minuteur indique la suite (série/tour n/N) et, au changement d’exercice, « 🔧 À préparer » avec le matériel, l’ancrage et la charge ou les élastiques de la dernière fois']],
 ['2.12.5','21/11/2026',['Démarrage : choix de l’enchaînement « 🔁 En tours (circuit) » ou « ➡️ Exercice par exercice » (toutes les séries d’un exercice puis le suivant), mémorisé ; l’aperçu suit ce choix']],
 ['2.12.4','21/11/2026',['Séance en cours : bouton ⏸ Pause / ▶ Reprendre pour arrêter le compteur de durée (le repos en cours est aussi mis en pause) ; la durée enregistrée exclut les pauses','Bouton ↺ 0:00 pour remettre le compteur à zéro tant qu’aucune série n’est validée']],
 ['2.12.3','21/11/2026',['Démarrage d’une séance : le mode reprise s’affiche dans la fenêtre (écart depuis la dernière séance, baisse des charges, séance n/N) avec une case pour l’appliquer ou non ; s’il avait été ignoré, lien « le réactiver »']],
 ['2.12.2','21/11/2026',['Progrès → Historique : séances regroupées par mois (nombre de séances et volume du mois), chaque mois se replie d’un tap ; ⊞ Tout déplier · ⊟ Tout replier ; filtre « Mois » pour n’afficher qu’un mois ; 📝 pour les séances saisies après coup']],
 ['2.12.1','21/11/2026',['Sauvegarde dans un dossier (PC) : autorisation demandée dès le choix du dossier, bouton « ✍️ Tester l’écriture » et affichage de la cause exacte en cas d’échec']],

  if(!T.running||T.paused)return;
  const r=tRem(),c=Math.ceil(r);
  if(c<=3&&c>=1&&!T.beeped[c]){T.beeped[c]=1;playSnd(db.settings.sndTick,TICKS)}
  if(r<=0){T.running=false;playSnd(/Rest-pause/.test(T.label)?db.settings.sndRp:db.settings.sndRest);if(db.settings.vibrate&&navigator.vibrate)navigator.vibrate([300,120,300,120,500]);$('#tbar').classList.add('end');T.hideAt=Date.now()+8000}

function adaptCount(mids,loc=curLoc()){let sub=0,miss=0;mids.forEach(mid=>{const m=db.modules.find(x=>x.id===mid);if(m)m.blocks.forEach(b=>b.items.forEach(it=>{const s=subFor(it.exId,loc);if(!s)miss++;else if(s!==it.exId)sub++}))});return {sub,miss}}

function resumeFor(){const st=db.settings,p=db.sessions[db.sessions.length-1];if(!p||!(+st.resumeDays>0)||st.resumeSkip===p.id)return null;const gap=(Date.now()-p.start)/864e5;
  if(gap>=+st.resumeDays)return {lvl:1,n:Math.max(1,+st.resumeN||1),gap:Math.round(gap),pct:+st.resumePct||0};

function nextMode(p){if(!p||!p.rotate||!(p.rotModes||[]).length)return null;const ids=p.rotModes.filter(id=>db.settings.repModes.some(m=>m.id===id));if(!ids.length)return null;const last=[...db.sessions].reverse().find(s=>s.programId===p.id&&s.mode);const i=last?ids.indexOf(last.mode.id):-1;return modeById(ids[(i+1)%ids.length])}
function adaptTarget(str,n,R,struct){const p=String(str||'').split('/').map(x=>x.trim()).filter(Boolean);const nums=p.map(x=>+firstNum(x)||0);const first=nums.find(v=>v>0)||0;const base=R||first;if(!base)return str;
  if(struct==='eq')return Array(n).fill(base).join('/');if(!R)return str;const out=[];for(let i=0;i<n;i++){const src=p[Math.min(i,p.length-1)]||'';if(/chec/i.test(src))out.push('échec');else out.push(Math.max(1,Math.round((+firstNum(src)||first)*R/first)))}return out.join('/')}
function bandCombo(kg){const B=db.settings.bands.filter(b=>+b.kg>0);let best=null;const rec=(i,sum,parts)=>{if(i===B.length){if(!parts.length)return;const d=Math.abs(sum-kg);if(!best||d<best.d-.01||(Math.abs(d-best.d)<.01&&parts.length<best.p.length))best={d,p:[...parts]};return}const b=B[i];for(let c=0;c<=Math.min(+b.n||1,4);c++)rec(i+1,sum+c*b.kg,[...parts,...Array(c).fill(b.name)])};rec(0,0,[]);return best?best.p.sort((a,b)=>bandKg(b)-bandKg(a)).join('+'):''}

  <div class="note xs">${it?`Exemple, ${esc(exById(it.exId)?.name||'')} : objectifs <b>${esc(String(prevT).replace(/\//g,' / '))}</b>`:''}${+md.reps||O.struct==='eq'?' · charges calculées depuis ton 1RM estimé (à valider dès la 1ʳᵉ série)':' · charges reprises de la dernière séance'}</div>

function buildActive(o){const loc=curLoc();let nS=0,nM=0;const blocks=[];
  o.moduleIds.forEach(mid=>{const m=db.modules.find(x=>x.id===mid);if(m)m.blocks.forEach(b=>blocks.push({type:b.type,sets:+b.sets||1,rest:+b.rest||0,restEnd:+b.restEnd||0,module:m.name,log:[],
    items:clone(b.items).map(it=>{const s=subFor(it.exId,loc);if(s&&s!==it.exId){nS++;return {...it,orig:it.exId,exId:s,load:'',band:''}}if(!s){nM++;return {...it,missing:true}}return it})}))});
  if(!blocks.length&&!o.free)return null;
  if(o.opts&&o.opts.split){const out=[];blocks.forEach(b=>{if(b.items.length<2){out.push(b);return}b.items.forEach((it,i)=>out.push({type:'single',sets:b.sets,rest:b.rest,restEnd:i===b.items.length-1?b.restEnd:0,module:b.module,log:[],items:[it],fromType:b.type}))});blocks.splice(0,blocks.length,...out)}
  const md=modeById(o.opts.mode),Rm=+md.reps||0;blocks.forEach(b=>{if(o.opts.rest&&Rm&&+md.rest)b.rest=+md.rest;b.items.forEach(it=>{const ex=exById(it.exId);if(ex&&isBW(ex)&&ex.mode!=='time')return;it.reps=adaptTarget(it.reps,b.sets,Rm,o.opts.struct)})});
  return {nS,nM,loc,act:{id:uid(),start:Date.now(),loc:loc.id,resume:o.opts&&(o.opts.noResume||o.opts.past)?null:resumeFor(),mode:{id:md.id,name:md.name,reps:Rm,struct:o.opts.struct},name:o.name+(loc.id!==db.settings.locations[0].id?' · '+loc.name:''),programId:o.programId||null,templateId:o.templateId||null,free:o.free?1:undefined,blocks,pendingRP:null}}}

function musCredits(st){const ex=exById(st.exId);if(!ex)return [];const out=[[ex.muscle,ex.sub||'',1]];const w=+db.settings.secW||0;if(w)(ex.sec||[]).forEach(s=>{const [g,sb]=s.split('|');out.push([g,sb||'',w])});return out}
function musView(){
  if(!db.sessions.length)return '<div class="card muted">Pas encore de séance.</div>';
  const W=6,D=7*864e5,wk=t=>{const d=new Date(t);return new Date(d.getFullYear(),d.getMonth(),d.getDate()-(d.getDay()+6)%7).getTime()};
  const lastS=db.sessions[db.sessions.length-1].start;let end=wk(Date.now());const recent=db.sessions.some(s=>s.start>=end-(W-1)*D);if(!recent)end=wk(lastS);
  const weeks=[...Array(W)].map((_,i)=>end-(W-1-i)*D);const G={},Sb={},sess=Array(W).fill('');
  db.sessions.forEach(s=>{const wi=weeks.findIndex(w=>s.start>=w&&s.start<w+D);if(wi<0)return;sess[wi]+=locIcon(s.loc);setsOf(s).forEach(st=>musCredits(st).forEach(([g,sb,w])=>{(G[g]=G[g]||Array(W).fill(0))[wi]+=w;const k=g+'|'+sb;(Sb[k]=Sb[k]||Array(W).fill(0))[wi]+=w}))});
  const mx=Math.max(1,...Object.values(G).flat()),mxs=Math.max(1,...Object.values(Sb).flat());const ms=[...GROUPS(),...Object.keys(G).filter(m=>!GROUPS().includes(m))].filter(m=>G[m]);
  const cell=(v,m)=>`<td style="background:rgba(255,138,61,${v?(.12+.6*v/m).toFixed(2):0})">${v?fmtNum(v):''}</td>`;
  S.musOpen=S.musOpen||{};let rows='';
  ms.forEach(m=>{rows+=`<tr class="tap" data-a="musOpen" data-v="${esc(m)}"><td style="text-align:left"><b>${S.musOpen[m]?'▾':'▸'} ${esc(m)}</b></td>${G[m].map(v=>cell(v,mx)).join('')}</tr>`;
    if(S.musOpen[m]){const subs=[...SUBS(m),''];subs.forEach(sb=>{const v=Sb[m+'|'+sb];if(!v&&sb==='')return;rows+=`<tr><td style="text-align:left;padding-left:14px" class="xs ${v?'':'muted'}">${sb?esc(sb):'non précisé'}</td>${(v||Array(W).fill(0)).map(x=>cell(x,mxs)).join('')}</tr>`})}});

  const last4=k=>(Sb[k]||[]).slice(-4).reduce((a,b)=>a+b,0);const flags=[];
  ms.forEach(m=>{const subs=SUBS(m);if(subs.length<2)return;const vals=subs.map(s=>[s,last4(m+'|'+s)]);const top=vals.reduce((a,b)=>b[1]>a[1]?b:a);if(top[1]<4)return;vals.forEach(([s,v])=>{if(/^Adducteurs$/i.test(s))return;if(v<top[1]/3)flags.push(`<div class="li sm">⚠ <b>${esc(m)} › ${esc(s)}</b> : ${fmtNum(v)} série(s) contre ${fmtNum(top[1])} pour ${esc(top[0])}</div>`)})});
  return `<div class="card"><div class="k">Séries par muscle et par semaine</div><p class="xs muted">Muscle principal = 1 série · secondaire = ${fmtNum(db.settings.secW)} série (réglable). Touche un groupe pour voir ses sous-groupes. Tous lieux confondus.${recent?'':' (6 semaines jusqu’à ta dernière séance)'}</p><div class="scroll"><table class="tbl heat"><tr><th></th>${weeks.map(w=>`<th>${fmtShort(w)}</th>`).join('')}</tr><tr><td class="xs muted" style="text-align:left">Séances</td>${sess.map(x=>`<td class="xs">${x||'·'}</td>`).join('')}</tr>${rows}</table></div></div>
  <div class="card"><div class="k">Repères — 4 dernières semaines affichées</div>${flags.join('')||'<p class="sm muted">Aucun sous-groupe nettement délaissé (moins d’un tiers du plus travaillé de son groupe).</p>'}<p class="xs muted">Un sous-groupe est signalé quand il reçoit moins d’un tiers des séries du sous-groupe le plus travaillé du même groupe.</p></div>`}

  if(!db.programs.length)return '<div class="card muted">Aucun programme.</div>';
  const p=progById(S.pprog)||db.programs[0];const ss=db.sessions.filter(s=>s.programId===p.id);const st=progStatus(p);
  let h=`<select data-ch="pickProg">${db.programs.map(x=>`<option value="${x.id}" ${x.id===p.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>
  <div class="card" style="margin-top:10px"><h2>${esc(p.name)}</h2>${p.goal?`<p class="sm muted">🎯 ${esc(p.goal)}</p>`:''}<div class="bar"><i style="width:${st.pct*100}%"></i></div><div class="xs muted">${st.text}</div>`;
  if(!ss.length)return h+'<p class="muted sm">Aucune séance réalisée dans ce programme pour l’instant.</p></div>';
  const weeks=Math.max(1,Math.ceil((Date.now()-ss[0].start)/(7*864e5)));const tot=ss.reduce((a,s)=>a+sessionTotals(s).volume,0);
  const rpes=ss.filter(s=>s.rpe).map(s=>s.rpe);
  h+=`<div class="kpis">${kpi('Séances',ss.length)}${kpi('Moy. / semaine',fmtNum(ss.length/weeks)+(p.perWeek&&p.durType==='semaines'?' / '+p.perWeek:''))}${kpi('Volume cumulé',fmtKg(tot))}${rpes.length?kpi('Ressenti moyen',fmtNum(rpes.reduce((a,b)=>a+b,0)/rpes.length)+'/10'):''}</div></div>`;
  h+=`<div class="card"><div class="k">Volume par séance</div>${chart(ss.map(s=>({label:fmtShort(s.start),y:sessionTotals(s).volume})))}</div>`;
  if(p.templates.length>1){h+=`<div class="card"><div class="k">Par séance type (1ʳᵉ → dernière)</div>`;p.templates.forEach(t=>{const ts=ss.filter(s=>s.templateId===t.id);if(!ts.length){h+=`<div class="li sm">${esc(t.name)} <span class="muted">· pas encore réalisée</span></div>`;return}const a=sessionTotals(ts[0]),b=sessionTotals(ts[ts.length-1]);h+=`<div class="li row sb"><div><b class="sm">${esc(t.name)}</b><div class="xs muted">${ts.length} fois</div></div><div style="text-align:right" class="sm">${fmtKg(a.volume)} → <b>${fmtKg(b.volume)}</b><div>${ts.length>1?delta(b.volume,a.volume):''}</div></div></div>`});h+='</div>'}
  const ids=[...new Set(ss.flatMap(exIdsOf))];let up=0,flat=0,down=0,rows='';
  ids.forEach(id=>{const w=ss.filter(s=>exSets(s,id).length);const f=exStats(exSets(w[0],id),id),l=exStats(exSets(w[w.length-1],id),id);
    if(w.length>1){const pc=f.best?(l.best-f.best)/f.best*100:0;if(pc>2)up++;else if(pc<-2)down++;else flat++}
    rows+=`<tr><td>${esc(exById(id)?.name||'(supprimé)')}<div class="xs muted">${w.length} séance(s) · ${l.bestLabel}</div></td><td>${fmtNum(f.best)} → <b>${fmtNum(l.best)}</b><br>${w.length>1?delta(l.best,f.best):''}</td><td>${fmtNum(f.volume)} → <b>${fmtNum(l.volume)}</b><br>${w.length>1?delta(l.volume,f.volume):''}</td></tr>`});
  h+=`<div class="card"><div class="k">Bilan par exercice (1ʳᵉ → dernière séance)</div><p class="sm">📈 <b>${up}</b> en progression · ➖ <b>${flat}</b> stables · 📉 <b>${down}</b> en baisse</p><table class="tbl"><tr><th>Exercice</th><th>Meilleure perf.</th><th>Volume</th></tr>${rows}</table></div>`;
  return h;
}
A.pickProg=el=>{S.pprog=el.value;render()};

/* ================= Programmes ================= */
V.programs=()=>`<button class="btn wide" data-a="newProgram">+ Nouveau programme</button><p class="xs muted">Un programme = un objectif + une durée (semaines ou nombre de séances) + des séances types construites à partir de tes modules, enchaînées en rotation.</p>`+
  db.programs.map(p=>{const st=progStatus(p);return `<div class="card tap" data-a="editProgram" data-id="${p.id}"><div class="row sb"><h2>${esc(p.name)}</h2>${p.active!==false?'<span class="tag on">Actif</span>':'<span class="tag">Archivé</span>'}</div>${p.goal?`<p class="sm muted">🎯 ${esc(p.goal)}</p>`:''}<div class="bar"><i style="width:${st.pct*100}%"></i></div><div class="xs muted">${st.text}</div><div class="xs" style="margin-top:6px">${p.templates.map(t=>esc(t.name)).join(' · ')}</div>${(()=>{const k='progx|'+p.id,o=hF(k);return `<button class="link xs" data-a="fold" data-v="${esc(k)}" style="margin-top:6px">${o?'▾ Masquer les modules':'▸ Voir les séances et leurs modules'}</button>${o?p.templates.map(t=>`<div style="margin-top:10px"><b>${esc(t.name)}</b>${t.moduleIds.map(mid=>{const m=db.modules.find(x=>x.id===mid);return m?modCard(m):''}).join('')}</div>`).join(''):''}`})()}</div>`}).join('');
const blankProgram=()=>({id:uid(),name:'',goal:'',durType:'seances',weeks:8,perWeek:3,count:24,start:today(),active:true,templates:[{id:uid(),name:'Séance A',moduleIds:[]}]});
A.newProgram=()=>{S.draft=blankProgram();go('programEdit')};
A.editProgram=el=>{S.draft=clone(progById(el.dataset.id));go('programEdit')};

  const d=S.draft;if(!d)return V.programs();

  <label class="fld"><span>Nom du programme</span><input data-f="name" value="${esc(d.name)}" placeholder="Ex : Haut du corps – 8 semaines"></label>

  ${d.durType==='semaines'?`<div class="row"><label class="fld"><span>Nombre de semaines</span><input type="number" data-f="weeks" value="${d.weeks}"></label><label class="fld"><span>Séances / semaine visées</span><input type="number" data-f="perWeek" value="${d.perWeek||3}"></label></div>`:`<label class="fld"><span>Nombre de séances</span><input type="number" data-f="count" value="${d.count}"></label>`}
  <label class="fld"><span>Date de début</span><input type="date" data-f="start" value="${esc(d.start)}"></label>

  <label class="chk"><input type="checkbox" data-f="rotate" data-rr ${d.rotate?'checked':''}> Rotation automatique des modes de répétitions</label>
  ${d.rotate?`<div class="xs muted">Touche les modes dans l’ordre voulu (le mode change à chaque séance du programme) :</div><div class="chips">${db.settings.repModes.map(m=>{const i=(d.rotModes||[]).indexOf(m.id);return `<button class="chip ${i>=0?'on':''}" data-a="rotTog" data-v="${m.id}">${i>=0?(i+1)+'. ':''}${esc(m.name)}</button>`}).join('')}</div><div class="xs" style="margin-top:4px">Ordre : <b>${(d.rotModes||[]).map(id=>esc(modeById(id).name)).join(' → ')||'aucun mode choisi'}</b></div>`:''}</div>
  <div class="k">Séances types — enchaînées en rotation (A → B → A…)</div>`;
  d.templates.forEach((t,ti)=>{h+=`<div class="card"><div class="row sb"><input class="ttl" data-f="templates.${ti}.name" value="${esc(t.name)}"><button class="icon" data-a="delTpl" data-i="${ti}" title="Supprimer">🗑</button></div>
    ${t.moduleIds.map((mid,mi)=>{const ctl=`<button class="icon" data-a="tplModUp" data-i="${ti}" data-j="${mi}" title="Monter">↑</button><button class="icon" data-a="tplModDel" data-i="${ti}" data-j="${mi}" title="Retirer de la séance">✕</button>`;const m=db.modules.find(x=>x.id===mid);return m?modCard(m,{ctl,noEdit:true}):`<div class="row sb li"><span class="sm">🧩 ${esc(modName(mid))}</span><span class="row">${ctl}</span></div>`}).join('')}
    <select data-ch="tplAddMod" data-i="${ti}" style="margin-top:8px"><option value="">+ Ajouter un module…</option>${db.modules.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select></div>`});
  h+=`<button class="btn ghost wide" data-a="addTpl">+ Ajouter une séance type</button><div class="row" style="margin-top:12px"><button class="btn wide" data-a="saveProgram">Enregistrer</button>${progById(d.id)?'<button class="btn danger ghost" data-a="delProgram">Supprimer</button>':''}</div>`;
  return h;

A.rotTog=el=>{const d=S.draft;d.rotModes=d.rotModes||[];const v=el.dataset.v,i=d.rotModes.indexOf(v);if(i>=0)d.rotModes.splice(i,1);else d.rotModes.push(v);render()};
A.durType=el=>{S.draft.durType=el.dataset.v;render()};
A.addTpl=()=>{const n=S.draft.templates.length;S.draft.templates.push({id:uid(),name:'Séance '+String.fromCharCode(65+n),moduleIds:[]});render()};
A.delTpl=el=>{S.draft.templates.splice(+el.dataset.i,1);render()};

A.saveProgram=()=>{const d=S.draft;if(!String(d.name).trim())return toast('Donne un nom au programme');d.weeks=Math.max(1,+d.weeks||1);d.count=Math.max(1,+d.count||1);d.perWeek=+d.perWeek||0;
  const i=db.programs.findIndex(p=>p.id===d.id);if(i>=0)db.programs[i]=d;else db.programs.push(d);save();toast('Programme enregistré');go('programs')};
A.delProgram=()=>ask('Supprimer ce programme ? Les séances déjà réalisées restent dans l’historique.','Supprimer').then(ok=>{if(ok){db.programs=db.programs.filter(p=>p.id!==S.draft.id);save();go('programs')}});

/* ================= Modules ================= */
function modCard(m,o={}){const ex=o.ctl||'';const k='mod|'+m.id,f=hF(k);
  if(f)return `<div class="card" style="padding:10px 14px"><div class="row sb" style="gap:8px;align-items:center"><div class="tap" data-a="fold" data-v="${esc(k)}" style="flex:1;min-width:0;cursor:pointer"><b><span class="fa" style="padding:0 6px 0 0">▸</span>${esc(m.name)}</b><div class="xs muted" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${m.blocks.map(b=>BLABEL[b.type]+' : '+b.items.map(i=>esc(exById(i.exId)?.name||'?')).join(' + ')).join(' · ')}</div></div>${ex?`<span class="row" style="gap:4px">${ex}</span>`:''}<button class="btn sm" data-a="startMod" data-m="${m.id}" title="Démarrer">▶</button></div></div>`;
  return `<div class="card"><div class="row sb" style="align-items:flex-start;gap:8px"><h2 class="tap" data-a="fold" data-v="${esc(k)}" style="cursor:pointer;margin:0"><span class="fa" style="padding:0 6px 0 0">▾</span>${esc(m.name)}</h2></div>${m.tag?`<div class="xs muted">${esc(m.tag)}</div>`:''}<div class="sm">${m.blocks.map(b=>`<div class="li"><span class="tag t-${b.type}">${BLABEL[b.type]}</span> ${b.items.map(i=>esc(exById(i.exId)?.name||'?')+eye(i.exId)+(i.rp?' <span class="rpx xs">⚡RP</span>':'')).join(' + ')} <div class="xs muted">${b.sets} ${b.type==='single'?'séries':'tours'} · ${restTxt(b)}</div></div>`).join('')}</div><div class="row wrap" style="margin-top:8px"><button class="btn sm" data-a="startMod" data-m="${m.id}">▶ Démarrer</button>${o.noEdit?'':`<button class="btn ghost sm" data-a="editModule" data-id="${m.id}">Modifier</button><button class="btn ghost sm" data-a="dupModule" data-id="${m.id}">Dupliquer</button>`}<button class="btn ghost sm ${hF('modp|'+m.id)?'on':''}" data-a="fold" data-v="${esc('modp|'+m.id)}">${hF('modp|'+m.id)?'🔍 Masquer l’aperçu':'🔍 Aperçu'}</button>${ex}</div>${hF('modp|'+m.id)?modPreview(m):''}</div>`}

function modPreview(m){const L=(ii)=>String.fromCharCode(65+ii)+'. ';
 return `<div style="margin-top:10px;border-top:1px solid var(--line);padding-top:8px">${m.blocks.map((b,bi)=>`<div style="margin:8px 0 4px"><span class="tag t-${b.type}">${BLABEL[b.type]}</span> <span class="xs muted">${b.sets} ${b.type==='single'?'séries':'tours'} · ${restTxt(b)}</span></div>${b.items.map((it,ii)=>{const ex=exById(it.exId)||{name:'?'};const last=getLastSets(it.exId);
  const tgt=String(it.reps||'').replace(/\//g,' / ');const start=it.band?('élastiques '+it.band):it.load?(it.load+(isPl(ex)?' pl.':' kg')):'';
  return `<div class="li" style="padding:8px 0"><div class="row sb" style="gap:8px;align-items:center"><b class="sm">${b.type==='single'?'':L(ii)}${esc(ex.name)}${eye(it.exId)}</b>${ex.type?`<span class="tag">${ex.type==='iso'?'Iso':'Poly'}</span>`:''}</div>
  <div class="xs">${ex.muscle?`<span class="mus" style="margin:2px 6px 2px 0">${muscLabel(ex)}</span>`:''}${ex.sec&&ex.sec.length?`<span class="muted">+ ${ex.sec.map(x=>esc(String(x).replace('|',' › '))).join(', ')}</span>`:''}</div>
  <div class="xs muted">${esc(EQUIP[ex.equip]||'')}${ex.anchor&&ex.anchor!==''?' · '+esc(ANCH[ex.anchor]||ex.anchor):''}${ex.uni?' · G puis D':''}${tgt?` · objectif <b style="color:var(--tx)">${esc(tgt)}</b>${ex.mode==='time'?' s':''}`:''}${start?' · départ '+esc(start):''}${it.rp?` · ⚡ rest-pause ${it.rp==='last'?'dernière série':'chaque série'} (${fmtDur(it.rpSec||db.settings.rpSec)})`:''}</div>
  ${last?`<div class="xs muted">Dernière fois (${fmtDate(last.session.start)}) : ${last.sets.map(fmtSet).join(' · ')}</div>`:'<div class="xs muted">Jamais fait pour l’instant</div>'}${ex.notes?`<div class="xs muted">📝 ${esc(ex.notes)}</div>`:''}</div>`}).join('')}`).join('')}</div>`}
const modGrp=m=>{const k=String(m.name||'').split(' · ');return k.length>1?k[0].trim():'Autres modules'};
V.modules=()=>{const G={};db.modules.forEach(m=>(G[modGrp(m)]=G[modGrp(m)]||[]).push(m));const keys=Object.keys(G).sort((a,b)=>a==='Autres modules'?1:b==='Autres modules'?-1:a.localeCompare(b,'fr',{numeric:true}));
 const card=m=>modCard(m);
 let h=`<button class="btn wide" data-a="newModule">+ Nouveau module</button><p class="xs muted">Un module est un bloc réutilisable (ex : « Haut du corps – Biceps / Triceps / Épaules »), composé d’exercices simples, de supersets ou de trisets. Touche un titre pour le replier ou le déplier.</p>
 <div class="chips"><button class="chip" data-a="modFold" data-v="0">⊞ Tout déplier</button><button class="chip" data-a="modFold" data-v="1">☰ Modules en résumé</button><button class="chip" data-a="modFold" data-v="2">⊟ Tout replier</button></div>`;
 keys.forEach(g=>{const fk='modg|'+g,fg=hF(fk);h+=`<div class="gh ${fg?'fold':''}" data-a="fold" data-v="${esc(fk)}"><span class="fa">${fg?'▸':'▾'}</span>${esc(g)} <span class="muted">(${G[g].length})</span></div>`;if(!fg)h+=G[g].map(card).join('')});
 return h};
A.modFold=el=>{const v=el.dataset.v,f=db.settings.fold=db.settings.fold||{};Object.keys(f).forEach(k=>{if(/^modg?\|/.test(k))delete f[k]});
 if(v==='1')db.modules.forEach(m=>f['mod|'+m.id]=1);if(v==='2')db.modules.forEach(m=>{f['modg|'+modGrp(m)]=1;f['mod|'+m.id]=1});save();render()};
const newItem=()=>({exId:(db.exercises[0]||{}).id||'',reps:'12/10/échec',load:'',band:'',rp:'last',rpSec:db.settings.rpSec});
const newBlock=t=>({id:uid(),type:t,sets:3,rest:db.settings.defaultRest,restEnd:t==='single'?0:240,items:[]});
function normMod(d){d.blocks.forEach(b=>{const n=b.type==='circuit'?Math.max(2,b.items.length||4):(BTYPE[b.type]||1);while(b.items.length<n)b.items.push(newItem());if(b.type!=='circuit')b.items.length=n;b.items.forEach(it=>{if(!exById(it.exId))it.exId=(db.exercises[0]||{}).id;})})}
A.newModule=()=>{if(!db.exercises.length)return toast('Crée d’abord des exercices');S.draft={id:uid(),name:'',tag:'',blocks:[newBlock('triset')]};go('moduleEdit')};

  let h=`<button class="link" data-a="go" data-v="modules">← Modules</button><div class="card"><label class="fld"><span>Nom du module</span><input data-f="name" value="${esc(d.name)}" placeholder="Ex : Haut du corps – Dos / Pecs / Abdos"></label><label class="fld"><span>Groupes musculaires / étiquette</span><input data-f="tag" value="${esc(d.tag||'')}"></label></div>`;

    h+=`<div class="card block"><div class="row sb"><select data-f="blocks.${bi}.type" data-rr style="max-width:180px">${Object.keys(BLABEL).map(k=>`<option value="${k}" ${b.type===k?'selected':''}>${BLABEL[k]}${k==='single'?'':k==='circuit'?' (4 exos et +)':' ('+BTYPE[k]+' exos)'}</option>`).join('')}</select><span class="row"><button class="icon" data-a="blkUp" data-i="${bi}">↑</button><button class="icon" data-a="blkDup" data-i="${bi}" title="Dupliquer">⧉</button><button class="icon" data-a="blkDel" data-i="${bi}" title="Supprimer">🗑</button></span></div>
    <div class="row"><label class="fld"><span>${b.type==='single'?'Séries':'Tours'}</span><input type="number" data-f="blocks.${bi}.sets" value="${b.sets}"></label><label class="fld"><span>Repos entre ${b.type==='single'?'séries':'tours'}</span><select data-f="blocks.${bi}.rest" data-num><option value="0" ${!+b.rest?'selected':''}>Aucun</option>${restOptions(b.rest)}</select></label><label class="fld"><span>Pause à la fin du bloc</span><select data-f="blocks.${bi}.restEnd" data-num><option value="0" ${!+b.restEnd?'selected':''}>Aucune</option>${restOptions(b.restEnd)}</select></label></div>`;
    b.items.forEach((it,ii)=>{const ex=exById(it.exId)||{};const P=`blocks.${bi}.items.${ii}`;
      h+=`<div class="item"><div class="sn">${b.type==='single'?'•':String.fromCharCode(65+ii)}</div><div class="grow"><div class="row"><select data-f="${P}.exId" data-rr>${exOptions(it.exId)}</select>${eye(it.exId,'icon')}${b.type==='circuit'&&b.items.length>2?`<button class="icon" data-a="itemDel" data-i="${bi}" data-j="${ii}">✕</button>`:''}</div>${ex.muscle?`<div class="mus">💪 ${muscLabel(ex)}${ex.type?' · '+(ex.type==='iso'?'Isolation':'Polyarticulaire'):''}</div>`:''}
      <div class="row"><label class="fld"><span>Objectif par ${b.type==='single'?'série':'tour'} (ex. 12/10/échec)</span><input data-f="${P}.reps" value="${esc(it.reps)}" placeholder="12/10/échec"></label>
      ${usesBands(ex)&&ex.mode!=='time'?`<label class="fld"><span>Élastiques de départ</span><input data-f="${P}.band" value="${esc(it.band||'')}" placeholder="ex. 25+10"></label>`:isBW(ex)&&ex.mode!=='time'?`<label class="fld"><span>Coef. ${ex.equip==='trx'?'TRX':'PDC'}</span><input type="number" step="0.05" data-f="${P}.load" value="${esc(it.load||1)}"></label>`:`<label class="fld"><span>${ex.mode==='time'?'Lest kg':isPl(ex)?'Plaques de départ':'Charge de départ kg'}</span><input type="number" step="any" data-f="${P}.load" value="${esc(it.load)}"></label>`}</div>
      <div class="row"><label class="fld"><span>Rest-pause (échec + pause + échec)</span><select data-f="${P}.rp" data-rr><option value="" ${!it.rp?'selected':''}>Non</option><option value="last" ${it.rp==='last'?'selected':''}>Dernière série uniquement</option><option value="all" ${it.rp&&it.rp!=='last'?'selected':''}>Chaque série</option></select></label>${it.rp?`<label class="fld" style="max-width:110px"><span>Pause (s)</span><input type="number" data-f="${P}.rpSec" value="${it.rpSec||db.settings.rpSec}"></label>`:''}</div></div></div>`});
    if(b.type==='circuit')h+=`<button class="btn ghost sm" data-a="itemAdd" data-i="${bi}" style="margin-top:8px">+ Exercice dans le circuit</button>`;
    h+='</div>'});
  h+=`<div class="row wrap"><button class="btn ghost" data-a="addBlk" data-v="single">+ Exercice simple</button><button class="btn ghost" data-a="addBlk" data-v="superset">+ Superset</button><button class="btn ghost" data-a="addBlk" data-v="triset">+ Triset</button><button class="btn ghost" data-a="addBlk" data-v="circuit">+ Circuit (4+)</button></div>
  <div class="row" style="margin-top:12px"><button class="btn wide" data-a="saveModule">Enregistrer le module</button>${db.modules.some(m=>m.id===d.id)?'<button class="btn danger ghost" data-a="delModule">Supprimer</button>':''}</div>`;
  return h;
};
A.addBlk=el=>{S.draft.blocks.push(newBlock(el.dataset.v));render();window.scrollTo(0,document.body.scrollHeight)};
A.blkUp=el=>{const i=+el.dataset.i,B=S.draft.blocks;if(i>0){[B[i-1],B[i]]=[B[i],B[i-1]];render()}};
A.blkDup=el=>{const i=+el.dataset.i,b=clone(S.draft.blocks[i]);b.id=uid();S.draft.blocks.splice(i+1,0,b);render()};
A.itemAdd=el=>{S.draft.blocks[+el.dataset.i].items.push(newItem());render()};
A.itemDel=el=>{S.draft.blocks[+el.dataset.i].items.splice(+el.dataset.j,1);render()};
A.blkDel=el=>{S.draft.blocks.splice(+el.dataset.i,1);render()};
A.saveModule=()=>{const d=S.draft;if(!String(d.name).trim())return toast('Donne un nom au module');if(!d.blocks.length)return toast('Ajoute au moins un bloc');
  d.blocks.forEach(b=>{b.sets=Math.max(1,+b.sets||1);b.rest=+b.rest||0;b.restEnd=+b.restEnd||0;b.items.forEach(it=>{it.rpSec=+it.rpSec||db.settings.rpSec})});
  const i=db.modules.findIndex(m=>m.id===d.id);if(i>=0)db.modules[i]=d;else db.modules.push(d);save();toast('Module enregistré');go('modules')};
A.delModule=()=>ask('Supprimer ce module ? Il sera retiré des programmes qui l’utilisent.','Supprimer').then(ok=>{if(!ok)return;const id=S.draft.id;db.modules=db.modules.filter(m=>m.id!==id);db.programs.forEach(p=>p.templates.forEach(t=>t.moduleIds=t.moduleIds.filter(x=>x!==id)));save();go('modules')});

/* ================= Exercices ================= */
V.exercises=()=>{
  const q=(S.exq||'').toLowerCase(),vw=S.exView||'mus';
  let h=`<div class="row" style="margin-bottom:10px"><input type="search" id="exq" placeholder="Rechercher un exercice…" value="${esc(S.exq)}"><button class="btn" data-a="editEx">+ Nouveau</button></div>
  <div class="seg">${[['mus','Par muscle'],['move','Par mouvement'],['eq','Par matériel']].map(([k,l])=>`<button class="${vw===k?'on':''}" data-a="exView" data-v="${k}">${l}</button>`).join('')}</div>
  <div class="chips" style="margin:-4px 0 10px"><button class="chip ${S.exType==='iso'?'on':''}" data-a="exType" data-v="iso">Isolation</button><button class="chip ${S.exType==='poly'?'on':''}" data-a="exType" data-v="poly">Polyarticulaire</button><button class="chip ${S.exHere?'on':''}" data-a="exHere">${curLoc().icon||''} Faisables : ${esc(curLoc().name)}</button><button class="chip" data-a="foldAll" data-v="0">⊞ Tout déplier</button><button class="chip" data-a="foldAll" data-v="1">⊟ Tout replier</button></div>`;
  const list=db.exercises.filter(e=>(e.name+' '+(e.sub||'')+' '+(e.move||'')).toLowerCase().includes(q)&&(!S.exHere||feasible(e))&&(!S.exType||e.type===S.exType));
  const row=e=>`<div class="li tap row sb" data-a="editEx" data-id="${e.id}"><span>${esc(e.name)}${vw==='move'?`<div class="xs muted">${muscLabel(e)}</div>`:vw==='eq'&&e.sub?`<div class="xs muted">${esc(e.sub)}</div>`:''}${e.sec&&e.sec.length?`<div class="xs muted">+ ${e.sec.map(s=>esc(s.replace('|',' › '))).join(', ')}</div>`:''}</span><span class="row" style="gap:4px"><button class="demo-b" data-a="demo" data-id="${e.id}" title="Voir le mouvement et mes vidéos">${(e.videos||[]).length?'🎬':'👁'}</button>${e.type?`<span class="tag ${e.type==='iso'?'t-single':'t-superset'}">${e.type==='iso'?'Iso':'Poly'}</span>`:''}${(()=>{const t=[vw==='eq'?'':EQUIP[e.equip]||e.equip,e.anchor&&e.anchor!=='pieds'?ANCH[e.anchor].replace('Ancrage ',''):'',e.unit==='plaque'?'plaques':'',e.uni?'G/D':'',e.mode==='time'?'durée':''].filter(Boolean).join(' · ');return t?`<span class="tag">${t}</span>`:''})()}</span></div>`;
  const byName=(a,b)=>a.name.localeCompare(b.name);
  if(vw==='mus'){const g={};list.forEach(e=>{(g[e.muscle]=g[e.muscle]||{});(g[e.muscle][e.sub||'']=g[e.muscle][e.sub||'']||[]).push(e)});
    [...GROUPS(),...Object.keys(g).filter(m=>!GROUPS().includes(m))].forEach(m=>{if(!g[m])return;const subs=[...SUBS(m),...Object.keys(g[m]).filter(s=>!SUBS(m).includes(s))];
      const fg=isF('g|'+m);h+=`<div class="gh ${fg?'fold':''}" data-a="fold" data-v="${esc('g|'+m)}"><span class="fa">${fg?'▸':'▾'}</span>${esc(m)} <span class="muted">(${Object.values(g[m]).flat().length})</span></div>`;
      if(!fg)h+=`<div class="card list">${subs.filter(s=>g[m][s]).map(s=>{const k='s|'+m+'|'+s,fs=isF(k);return `<div class="sgh ${fs?'fold':''}" data-a="fold" data-v="${esc(k)}" ${s?'':'style="color:var(--mu)"'}><span class="fa">${fs?'▸':'▾'}</span>${s?esc(s):'Sous-groupe non précisé'} <span class="xs muted">(${g[m][s].length})</span></div>${fs?'':g[m][s].sort(byName).map(row).join('')}`}).join('')}</div>`})}
  else{const key=vw==='move'?(e=>e.move||'(sans mouvement)'):(e=>EQUIP[e.equip]||e.equip);const g={};list.forEach(e=>(g[key(e)]=g[key(e)]||[]).push(e));
    Object.keys(g).sort((a,b)=>a.localeCompare(b)).forEach(k=>{const fk=isF(vw+'|'+k);h+=`<div class="gh ${fk?'fold':''}" data-a="fold" data-v="${esc(vw+'|'+k)}"><span class="fa">${fk?'▸':'▾'}</span>${esc(k)} <span class="muted">(${g[k].length})</span></div>`;
      if(fk)return;
      if(vw==='eq'){const gm={};g[k].forEach(e=>(gm[e.muscle]=gm[e.muscle]||[]).push(e));
        h+=`<div class="card list">${[...GROUPS(),...Object.keys(gm).filter(m=>!GROUPS().includes(m))].filter(m=>gm[m]).map(m=>{const sk='eqm|'+k+'|'+m,fs=isF(sk);return `<div class="sgh ${fs?'fold':''}" data-a="fold" data-v="${esc(sk)}"><span class="fa">${fs?'▸':'▾'}</span>${esc(m)} <span class="xs muted">(${gm[m].length})</span></div>${fs?'':gm[m].sort(byName).map(row).join('')}`}).join('')}</div>`}
      else h+=`<div class="card list">${g[k].sort(byName).map(row).join('')}</div>`})}
  if(!list.length)h+='<div class="card muted">Aucun exercice ne correspond aux filtres.</div>';
  return h;
};
const hF=k=>!!(db.settings.fold||{})[k];
const isF=k=>!S.exq&&!!(db.settings.fold||{})[k];
A.fold=el=>{const f=db.settings.fold=db.settings.fold||{};const k=el.dataset.v;if(f[k])delete f[k];else f[k]=1;save();render()};
A.foldAll=el=>{const f=Object.fromEntries(Object.entries(db.settings.fold||{}).filter(([k])=>/^(modg?|home)\|/.test(k)));if(el.dataset.v==='1'){db.exercises.forEach(e=>{f['g|'+e.muscle]=1;f['move|'+(e.move||'(sans mouvement)')]=1;f['eq|'+(EQUIP[e.equip]||e.equip)]=1})}db.settings.fold=f;save();render()};
A.exView=el=>{S.exView=el.dataset.v;render()};
A.exType=el=>{S.exType=S.exType===el.dataset.v?'':el.dataset.v;render()};
A.exHere=()=>{S.exHere=!S.exHere;render()};
A.editEx=el=>{const tpl=S.exTpl;S.exTpl=null;S.eMoveLast=null;const e=el.dataset.id?exById(el.dataset.id):tpl||{id:'',name:'',muscle:GROUPS()[0],sub:'',type:'iso',sec:[],equip:'halteres',mode:'reps',notes:'',move:'',anchor:''};const mus=GROUPS().includes(e.muscle)?GROUPS():[...GROUPS(),e.muscle];S.eSec=clone(e.sec||[]);
  modal(`<h3>${e.id?'Modifier l’exercice':tpl?'Nouvel exercice (copie)':'Nouvel exercice'}</h3>${e.id?`<button class="btn ghost wide" data-a="demo" data-id="${e.id}" style="margin-bottom:10px">👁 Voir le mouvement · ▶ vidéos</button>`:''}<label class="fld"><span>Nom</span><input id="eName" value="${esc(e.name)}"></label>
  <label class="fld"><span>Mouvement (équivalences) — choisis un mouvement existant pour reprendre son classement</span><input id="eMove" list="moves" data-ch="eMoveCh" value="${esc(e.move||'')}" placeholder="ex. Face pull"><datalist id="moves">${[...new Set(db.exercises.map(x=>x.move).filter(Boolean))].sort().map(m=>`<option value="${esc(m)}">`).join('')}</datalist></label><div id="eSugg"></div>
  <div class="row"><label class="fld"><span>Groupe musculaire</span><select id="eMus" data-ch="eMusCh">${mus.map(m=>`<option ${m===e.muscle?'selected':''}>${esc(m)}</option>`).join('')}</select></label><label class="fld"><span>Sous-groupe (principal)</span><select id="eSub">${subOpts(e.muscle,e.sub)}</select></label></div>
  <div class="row"><label class="fld"><span>Type</span><select id="eType"><option value="iso">Isolation</option><option value="poly" ${e.type==='poly'?'selected':''}>Polyarticulaire</option></select></label><label class="fld"><span>Matériel</span><select id="eEq">${Object.entries(EQUIP).map(([k,l])=>`<option value="${k}" ${k===e.equip?'selected':''}>${l}</option>`).join('')}</select></label></div>
  <div class="fld"><span>Muscles secondaires (comptent pour ${fmtNum(db.settings.secW)} série)</span><div id="eSecList" class="chips">${secHtml()}</div><select data-ch="eSecAdd"><option value="">+ Ajouter un muscle secondaire…</option>${GROUPS().map(g=>`<optgroup label="${esc(g)}"><option value="${esc(g)}">${esc(g)} (tout le groupe)</option>${SUBS(g).map(s=>`<option value="${esc(g+'|'+s)}">${esc(g)} › ${esc(s)}</option>`).join('')}</optgroup>`).join('')}</select></div>
  <div class="row"><label class="fld"><span>Ancrage</span><select id="eAnch">${Object.entries(ANCH).map(([k,l])=>`<option value="${k}" ${k===(e.anchor||'')?'selected':''}>${l}</option>`).join('')}</select></label></div>
  <label class="fld"><span>Unité de charge</span><select id="eUnit"><option value="">kg</option><option value="plaque" ${e.unit==='plaque'?'selected':''}>Plaques (poulie)</option></select></label>
  <div class="row"><label class="fld"><span>Mesure</span><select id="eMode"><option value="reps">Répétitions</option><option value="time" ${e.mode==='time'?'selected':''}>Durée (s)</option></select></label><label class="chk" style="flex:1"><input type="checkbox" id="eUni" ${e.uni?'checked':''}> Unilatéral (G puis D)</label></div>
  <label class="fld"><span>Notes / consignes / réglages</span><textarea id="eNotes" rows="2">${esc(e.notes)}</textarea></label>
  <details style="margin:6px 0 10px"><summary class="sm" style="cursor:pointer;color:var(--ac2)">❓ Comment classer un exercice ?</summary><div class="xs" style="line-height:1.55;margin-top:6px">
  <b>Iso ou Poly :</b> une seule articulation bouge → <b>Isolation</b> (curl, élévation, leg curl, extension). Plusieurs → <b>Polyarticulaire</b> (développé, rowing, tractions, squat, fentes, soulevé de terre) : ajoute alors des secondaires.<br>
  <b>Muscle principal :</b> celui qui brûle et lâche en premier.<br>
  <b>Pousser</b> : horizontal → Pecs milieu · incliné → Pecs haut · décliné / dips → Pecs bas · au-dessus de la tête → Épaules antérieur (secondaires : Triceps, Épaules antérieur).<br>
  <b>Tirer</b> : vers le bas → Grand dorsal · vers le ventre → Trapèzes moyens / rhomboïdes · vers le visage coudes hauts → Épaules postérieur (secondaires : Biceps, Épaules postérieur).<br>
  <b>Épaules</b> : élévation latérale → Latéral · frontale → Antérieur · shrug → Trapèzes sup.<br>
  <b>Biceps</b> : bras derrière le corps → Chef long · bras devant (pupitre, concentration) → Chef court · prise marteau → Brachial (+ Brachio-radial).<br>
  <b>Triceps</b> : bras au-dessus de la tête → Chef long · bras le long du corps (poulie haute) → Chef latéral.<br>
  <b>Jambes</b> : squat / fentes / presse → Quadriceps (+ Fessiers) · leg curl, SDT jambes tendues → Ischios · pont / hip thrust → Grand fessier · abduction → Moyen fessier.<br>
  <b>Abdos</b> : crunch / relevés → Grand droit · rotations → Obliques · gainage / roller → Transverse.<br>
  Rien n’est figé : corriger un exercice ne change pas son historique.</div></details>
  <div class="row wrap"><button class="btn" data-a="saveEx" data-id="${e.id}">Enregistrer</button>${e.id?`<button class="btn ghost" data-a="dupEx" data-id="${e.id}">⧉ Dupliquer</button><button class="btn danger ghost" data-a="delEx" data-id="${e.id}">Supprimer</button>`:''}<button class="btn ghost" data-a="closeModal">Annuler</button></div>`)};
const subOpts=(g,sel)=>`<option value="">— non précisé —</option>`+SUBS(g).map(s=>`<option ${s===sel?'selected':''}>${esc(s)}</option>`).join('')+(sel&&!SUBS(g).includes(sel)?`<option selected>${esc(sel)}</option>`:'');
const secHtml=()=>(S.eSec||[]).map((s,i)=>`<button class="chip" data-a="eSecDel" data-i="${i}">${esc(s.replace('|',' › '))} ✕</button>`).join('')||'<span class="xs muted">Aucun</span>';
A.eMoveCh=el=>{const v=el.value.trim();const box=$('#eSugg');if(!box||S.eMoveLast===v)return;S.eMoveLast=v;const cur=$('#eName').value.trim();const src=db.exercises.find(x=>x.move&&x.move.toLowerCase()===v.toLowerCase()&&x.name!==cur&&x.sub)||null;
  box.innerHTML=src?`<div class="note sm" style="margin:-2px 0 8px">Classement de « ${esc(src.name)} » : <b>${muscLabel(src)}</b> · ${TYPE[src.type]||''}${src.sec&&src.sec.length?' · + '+src.sec.map(s=>esc(s.replace('|',' › '))).join(', '):''}<div style="margin-top:6px"><button class="btn sm" data-a="eApply" data-id="${src.id}">Reprendre ce classement</button></div></div>`:''};
A.eApply=el=>{const s=exById(el.dataset.id);if(!s)return;$('#eMus').value=s.muscle;$('#eSub').innerHTML=subOpts(s.muscle,s.sub);$('#eType').value=s.type||'iso';S.eSec=clone(s.sec||[]);$('#eSecList').innerHTML=secHtml();$('#eSugg').innerHTML='<div class="xs hint" style="margin:-2px 0 8px">✓ Classement repris : vérifie et ajuste si besoin.</div>'};
A.dupEx=el=>{const s=clone(exById(el.dataset.id));s.id='';s.name+=' (copie)';S.exTpl=s;A.editEx({dataset:{}});setTimeout(()=>{const n=$('#eName');if(n){n.focus();n.select()}},50)};
A.eMusCh=el=>{$('#eSub').innerHTML=subOpts(el.value,'')};
A.eSecAdd=el=>{if(el.value&&!S.eSec.includes(el.value))S.eSec.push(el.value);el.value='';$('#eSecList').innerHTML=secHtml()};
A.eSecDel=el=>{S.eSec.splice(+el.dataset.i,1);$('#eSecList').innerHTML=secHtml()};
A.saveEx=el=>{const name=$('#eName').value.trim();if(!name)return toast('Donne un nom');const o={name,muscle:$('#eMus').value,sub:$('#eSub').value,type:$('#eType').value,sec:clone(S.eSec||[]),unit:$('#eUnit').value,equip:$('#eEq').value,mode:$('#eMode').value,uni:$('#eUni').checked,move:$('#eMove').value.trim(),anchor:$('#eAnch').value,notes:$('#eNotes').value.trim()};
  let nid=null;if(el.dataset.id)Object.assign(exById(el.dataset.id),o);else{nid=uid();db.exercises.push({id:nid,...o})}save();closeModal();render();toast('Exercice enregistré');if(S.afterExSave==='pick'&&S.pick&&db.active){S.afterExSave=null;if(nid)S.pick.sel.push(nid);S.pick.q='';A.addExToWorkout()}};
A.delEx=el=>{const id=el.dataset.id;if(db.modules.some(m=>m.blocks.some(b=>b.items.some(i=>i.exId===id))))return toast('Exercice utilisé dans un module : retire-le d’abord');ask('Supprimer cet exercice ? (l’historique est conservé)','Supprimer').then(ok=>{if(ok){db.exercises=db.exercises.filter(e=>e.id!==id);save();render()}})};

/* ================= Réglages & données ================= */
V.settings=()=>{const st=db.settings;return `<div class="chips" style="margin-bottom:4px"><button class="chip" data-a="setFoldAll" data-v="0">⊞ Tout déplier</button><button class="chip" data-a="setFoldAll" data-v="1">⊟ Tout replier</button><button class="chip" data-a="saveSettings">💾 Enregistrer les réglages</button></div><div class="card"><div class="k">Lieux et matériel</div><p class="xs muted">Les exercices non faisables sont remplacés automatiquement par un équivalent (même « mouvement »).</p>${st.locations.map((l,li)=>`<div class="li"><div class="row"><input id="lic-${li}" value="${esc(l.icon||'')}" style="max-width:58px"><input id="lnm-${li}" value="${esc(l.name)}"></div><div class="chips">${Object.keys(EQUIP).filter(k=>k!=='pdc').map(k=>`<label class="chip"><input type="checkbox" class="leq" data-l="${li}" value="${k}" ${l.equip.includes(k)?'checked':''}> ${EQUIP[k]}</label>`).join('')}${['haut','median','bas'].map(k=>`<label class="chip"><input type="checkbox" class="lan" data-l="${li}" value="${k}" ${(l.anchors||[]).includes(k)?'checked':''}> ${ANCH[k]}</label>`).join('')}</div></div>`).join('')}<button class="btn ghost sm" data-a="addLoc" style="margin-top:8px">+ Lieu</button></div>
<div class="card"><div class="k">Élastiques (kit SmartWorkout)</div><p class="xs muted">Nom = ce que tu tapes en séance (ex. « 25+10 »), kg = résistance, × = nombre possédé. Les combinaisons s’additionnent.</p>${st.bands.map((b,i)=>`<div class="row" style="margin-bottom:6px"><input id="bn-${i}" value="${esc(b.name)}"><input id="bk-${i}" type="number" step="0.5" value="${b.kg}" style="max-width:80px"><span class="xs muted">kg ×</span><input id="bq-${i}" type="number" value="${b.n||1}" style="max-width:60px"><button class="icon" data-a="delBand" data-i="${i}">✕</button></div>`).join('')}<button class="btn ghost sm" data-a="addBand" style="margin-top:8px">+ Élastique</button></div>
<div class="card"><div class="k">Calculs</div><div class="row"><label class="fld"><span>Formule du 1RM estimé</span><select id="sRmF"><option value="epley" ${st.rmF==='epley'?'selected':''}>Epley</option><option value="brzycki" ${st.rmF==='brzycki'?'selected':''}>Brzycki</option><option value="avg" ${st.rmF==='avg'?'selected':''}>Moyenne des deux</option></select></label><label class="fld"><span>Poids d’un muscle secondaire</span><select id="sSecW">${[[0,'0 (principal seul)'],[0.25,'¼ série'],[0.5,'½ série']].map(([v,l])=>`<option value="${v}" ${+st.secW===v?'selected':''}>${l}</option>`).join('')}</select></label></div><p class="xs muted">Les formules sont fiables jusqu’à ~12 reps ; au-delà, le 1RM est surtout un indice de progression.</p></div>
<div class="card"><div class="k">Groupes et sous-groupes musculaires</div><p class="xs muted">Une ligne par groupe : « Groupe : sous-groupe, sous-groupe… ». Renommer un sous-groupe ne modifie pas les exercices déjà classés.</p><textarea id="sTree" rows="12" style="font-size:14px">${esc(Object.entries(st.muscleTree).map(([g,s])=>g+' : '+s.join(', ')).join('\n'))}</textarea></div>
<div class="card"><div class="k">Modes de répétitions</div><p class="xs muted">Proposés au démarrage de chaque séance. Reps = objectif de la 1ʳᵉ série (les suivantes suivent ta structure dégressive), repos = repos entre tours si « Repos automatique » est coché.</p>${st.repModes.map((m,i)=>m.id==='normal'?`<div class="li sm">Normal (programme) <span class="xs muted">· objectifs, charges et repos du programme</span></div>`:`<div class="row" style="margin-bottom:6px"><input id="mn-${i}" value="${esc(m.name)}"><input id="mr-${i}" type="number" value="${m.reps}" style="max-width:70px" title="reps"><span class="xs muted">reps</span><input id="ms-${i}" type="number" value="${m.rest}" style="max-width:76px" title="repos (s)"><span class="xs muted">s</span><button class="icon" data-a="delMode" data-i="${i}">✕</button></div>`).join('')}<button class="btn ghost sm" data-a="addMode" style="margin-top:6px">+ Mode</button></div>
<div class="card"><div class="k">Reprise après une pause</div><div class="row"><label class="fld"><span>Pause déclenchant la reprise (jours)</span><input id="sRsD" type="number" value="${st.resumeDays}"></label><label class="fld"><span>Réduction des charges (%)</span><input id="sRsP" type="number" value="${st.resumePct}"></label><label class="fld"><span>Séances de reprise</span><select id="sRsN"><option value="1" ${+st.resumeN===1?'selected':''}>1</option><option value="2" ${+st.resumeN!==1?'selected':''}>2 (la 2ᵉ à −moitié)</option></select></label></div><p class="xs muted">0 jour = mode reprise désactivé.</p></div>
<div class="card"><div class="k">Chrono</div><label class="fld"><span>Temps prédéfinis (secondes, séparés par des virgules)</span><input id="sTimers" value="${st.timers.join(', ')}"></label><div class="row"><label class="fld"><span>Repos par défaut (s)</span><input id="sRest" type="number" value="${st.defaultRest}"></label><label class="fld"><span>Rest-pause par défaut (s)</span><input id="sRp" type="number" value="${st.rpSec}"></label><label class="fld"><span>Transition en circuit (s)</span><input id="sTrans" type="number" value="${st.transSec||25}"></label></div>
<div class="fld"><span class="k" style="margin:0">Sonneries</span></div>
<label class="fld"><span>Fin du repos / de la pause</span><div class="row"><select id="sSndRest">${Object.entries(SOUNDS).map(([k,v])=>`<option value="${k}" ${st.sndRest===k?'selected':''}>${v.label}</option>`).join('')}</select><button class="icon" data-a="sndTest" data-t="sSndRest" data-s="S" title="Écouter">▶</button></div></label>

function hstr(x){let h=5381;for(let i=0;i<x.length;i++)h=(h*33^x.charCodeAt(i))|0;return (h>>>0).toString(36)}
const exCore=e=>{const {videos,...r}=e;return hstr(JSON.stringify(r))};

function unsaved(){const lb=+db.settings.lastBackup||0;const fp=db.settings.bkFp||{s:db.sessions.filter(x=>x.end<=lb).map(x=>x.id),v:db.exercises.flatMap(e=>(e.videos||[]).filter(v=>(v.added||0)<=lb).map(v=>e.id+'|'+v.url)),e:null,m:null,p:null};
 const S1=new Set(fp.s),V1=new Set(fp.v),now=db.exercises.flatMap(e=>(e.videos||[]).map(v=>e.id+'|'+v.url)),V2=new Set(now);
 const u={sess:db.sessions.filter(x=>!S1.has(x.id)).length+fp.s.filter(id=>!db.sessions.some(x=>x.id===id)).length,
  vids:now.filter(k=>!V1.has(k)).length+fp.v.filter(k=>!V2.has(k)).length,
  ex:fp.e?db.exercises.filter(e=>fp.e[e.id]!==exCore(e)).length+Object.keys(fp.e).filter(id=>!db.exercises.some(e=>e.id===id)).length:0,
  mod:fp.m&&fp.m!==hstr(JSON.stringify(db.modules))?1:0,prog:fp.p&&fp.p!==hstr(JSON.stringify(db.programs))?1:0};
 u.total=u.sess+u.vids+u.ex+u.mod+u.prog;return u}
function unsavedTxt(u){return [u.sess&&u.sess+' séance'+(u.sess>1?'s':''),u.vids&&u.vids+' vidéo'+(u.vids>1?'s':''),u.ex&&u.ex+' exercice'+(u.ex>1?'s':''),u.mod&&'modules',u.prog&&'programmes'].filter(Boolean).join(' · ')}

A.impMerge=()=>{const d=S.impData;if(!d)return;S.impData=null;snapAdd('Avant fusion');const R=mergeData(migrate(clone(d)));save();closeModal();go('home');
 const parts=[R.s&&R.s+' séance(s)',R.v&&R.v+' vidéo(s)',R.e&&R.e+' exercice(s)',R.m&&R.m+' module(s)',R.p&&R.p+' programme(s)'].filter(Boolean);

function mergeData(d){const R={s:0,v:0,e:0,m:0,p:0,twin:0},norm=x=>String(x||'').trim().toLowerCase(),map={};
 for(const e of d.exercises){let loc=exById(e.id);
  if(!loc){const tw=db.exercises.find(x=>norm(x.name)===norm(e.name)&&x.equip===e.equip);if(tw){map[e.id]=tw.id;loc=tw;R.twin++}}
  if(!loc){db.exercises.push(clone(e));R.e++;continue}
  for(const v of e.videos||[])if(!(loc.videos||[]).some(x=>x.url===v.url)){(loc.videos=loc.videos||[]).push(clone(v));R.v++}}
 const mp=id=>map[id]||id,remap=o=>{if(Array.isArray(o))o.forEach(remap);else if(o&&typeof o==='object')for(const k in o){if((k==='exId'||k==='orig')&&typeof o[k]==='string')o[k]=mp(o[k]);else remap(o[k])}};
 remap(d.sessions);remap(d.modules);
 const sid=new Set(db.sessions.map(x=>x.id)),skey=new Set(db.sessions.map(x=>x.start+'|'+x.name));
 for(const x of d.sessions||[])if(!sid.has(x.id)&&!skey.has(x.start+'|'+x.name)){db.sessions.push(clone(x));R.s++}
 db.sessions.sort((a,b)=>a.start-b.start);
 for(const m of d.modules||[])if(!db.modules.some(x=>x.id===m.id)){db.modules.push(clone(m));R.m++}
 for(const p of d.programs||[])if(!db.programs.some(x=>x.id===p.id)){const c=clone(p);c.active=false;db.programs.push(c);R.p++}
 for(const k in d.subs||{}){const [l,x]=k.split('|'),k2=l+'|'+mp(x);if(!(k2 in db.subs))db.subs[k2]=mp(d.subs[k])}
 return R}

 const ids=b.items.map(it=>it.exId),same=prev===b;const sig=ex=>ex?[ex.equip,ex.anchor||''].join('|'):'';
 const prevSig=prev?new Set(prev.items.map(it=>sig(exById(it.exId)))):new Set();
 const lines=b.items.map(it=>{const ex=exById(it.exId);if(!ex)return '';const chg=!same&&!prevSig.has(sig(ex));return `${chg?'<span class="chg">🔧</span> ':''}<b>${esc(ex.name)}</b> — ${esc(exGear(ex,it))}`}).filter(Boolean);

 <div id="v3d" class="v3d"><div class="sm muted" style="padding:120px 10px;text-align:center">Chargement du mannequin…</div></div><div class="xs muted" style="text-align:center">↔ glisse pour faire tourner le mannequin · schéma indicatif</div>
 <div class="lg xs"><span><i style="background:#f08a6c"></i>Principal : ${muscLabel(ex)}</span>${sec.length?`<span><i style="background:#eeb39b"></i>Secondaire : ${sec.map(esc).join(', ')}</span>`:''}</div>
 ${ex.notes?`<div class="xs muted" style="margin-bottom:10px">📝 ${esc(ex.notes)}</div>`:''}
 <div id="animFix">${animFixHtml(ex)}</div>
 <div id="vidBox" data-id="${ex.id}">${vidHtml(ex)}</div>
 <a class="btn ${(ex.videos||[]).length?'ghost ':''}wide" href="${yt}" target="_blank" rel="noopener" style="display:block;text-align:center;text-decoration:none;margin-bottom:8px">🔎 Chercher des vidéos sur YouTube</a><button class="btn ghost wide" data-a="closeDemo">Fermer</button></div>`;d.hidden=false;
 vidRefresh(ex);
 loadThree().then(()=>{const v=$('#v3d');if(!v||d.hidden)return;try{VW=viewer3d(v,ex)}catch(err){console.error(err);v.innerHTML='<p class="sm" style="padding:20px">Animation indisponible sur cet appareil.</p>'}})
  .catch(()=>{const v=$('#v3d');if(v)v.innerHTML='<p class="sm" style="padding:30px 16px;text-align:center">📡 Le mannequin 3D se charge à la première ouverture avec une connexion. Ensuite il fonctionne hors ligne.<br>Le lien vidéo marche dès que tu es en ligne.</p>'})};
</script>
</body>
</html>
